# Nightly checks: the part of `make nightly` (bench-macro fuzz leak deadcode) that can
# run in CI. It never runs on pull requests or pushes, so it cannot block a PR gate.
#
#   fuzz      — run here (10 min, FuzzProtoToHandoff).
#   leak      — already runs on every push to main (ci.yml `leak` job).
#   deadcode  — already reported on every push to main (ci.yml `leak` job, advisory).
#   bench-macro — NOT run: it needs the gitignored internal/benchmarks/ (ADR-0057,
#                 decisions/no-benchmark-in-oss), which a CI checkout does not have.
#
# `make release-gate` is deliberately not scheduled: chaos-real cannot pass yet
# (T-20261031-chaos-real-cannot-pass-and-injects-no-fault) and bench-macro is absent
# from CI checkouts. (contract-release, which ran a test file that never existed, was
# removed from release-gate 2026-11-14 — ENG-180.) A red-every-night job trains people to
# ignore it. Run release-gate by hand before a release (AGENTS.md §4.7).
#
# T-20261031-nightly-and-release-gate-checks-are-not-run-by.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily (off the hour, when runners are busiest)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz — proto → handoff mapping (10 min)
        run: make fuzz
