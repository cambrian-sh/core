# Per-PR verification gate.
#
# This runs the same checks as `make per-pr`:
#   proto-check proto-breaking test-race separability integration chaos bench-micro
#
# They are invoked as individual steps rather than the single `per-pr` target so a
# failure names the gate that failed in the GitHub UI instead of one opaque red X.
# Keep this list in sync with the `per-pr` target in the Makefile.
#
# Until this workflow existed, none of these gates ran anywhere except on a
# developer's machine by convention — the repository's only workflow built and
# pushed a container image and ran no tests.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Canonical toolchain, per the Makefile header. A mismatch here is exactly what
  # proto-check exists to report, so these are pinned deliberately.
  PROTOC_VERSION: "34.1"
  PROTOC_GEN_GO_VERSION: "v1.36.11"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.6.1"
  BUF_VERSION: "v1.47.2"

jobs:
  verify:
    runs-on: ubuntu-latest

    # The Postgres integration tests (internal/infrastructure/postgres — tier 0 of
    # the memory stack, the raw PgVectorAdapter, plus the conversation, session,
    # link, event and query-plane stores — and internal/migrate's document-split
    # test) all t.Skip without PG_TEST_DSN. Before this service existed none of
    # them had ever run in CI, under -race or otherwise, so a DDL or locking
    # change looked green (T-20261031-core-ci-never-runs-the-postgres-adapter-or;
    # premium's workflow is the model, T-20261031-premium-s-postgres-tests-never-run-in-ci).
    #
    # pgvector/pgvector:pg16 because the baseline migration needs the `vector`
    # (and contrib `ltree`) extensions. The database name must look disposable
    # (`*_test`): internal/migrate's split test renames the documents table and
    # refuses any database whose name does not say test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cambrian
          POSTGRES_PASSWORD: cambrian
          POSTGRES_DB: cambrian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cambrian -d cambrian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # buf breaking compares against `.git#branch=main`, so the full history
          # and the main ref must both be present. A shallow clone fails the gate.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # ── Toolchain ────────────────────────────────────────────────────────────
      - name: Install protoc
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install protoc plugins
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ── Baseline ─────────────────────────────────────────────────────────────
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # ── per-pr gates ─────────────────────────────────────────────────────────
      - name: Gate — generated bindings match .proto sources
        run: make proto-check

      - name: Gate — operator contract is not backward-incompatible
        run: make proto-breaking

      - name: Gate — open-core boundary + OTel isolation
        run: make separability

      # PG_TEST_DSN is deliberately NOT set here. `make test-race` runs every
      # package in parallel, and the two Postgres-backed packages are destructive
      # to the same database: internal/migrate's split test DROPs documents,
      # chunks and schema_migrations, and the adapter tests DROP/CREATE chunks and
      # conversations. Run concurrently against one database they would corrupt
      # each other's schema mid-test. They get their own serialised step below;
      # here they skip exactly as they did before, and the next step is what
      # turns that skip into a failure.
      - name: Gate — unit tests under the race detector
        run: make test-race

      # Core's schema is a precondition for the link, event and query-plane
      # tests (they INSERT into evidence/entities/links and create nothing).
      # Apply it with core's own runner — the same `orchestrator migrate up` an
      # operator runs — rather than a copied DDL that could drift. No
      # configs/config.json exists in a fresh checkout; the CAMBRIAN_* env layer
      # supplies the connection. 1536 dimensions, not premium's 1024: the
      # adapter tests build a PgVectorAdapter{dim: 1536}, and a mismatch makes
      # ensureSchema drop and recreate `documents` (CASCADE takes `chunks` with
      # it), which fails every adapter test that follows.
      - name: Apply migrations to the test database
        env:
          CAMBRIAN_DATABASE__HOST: localhost
          CAMBRIAN_DATABASE__PORT: "5432"
          CAMBRIAN_DATABASE__USER: cambrian
          CAMBRIAN_DATABASE__PASSWORD: cambrian
          CAMBRIAN_DATABASE__DBNAME: cambrian_test
          CAMBRIAN_EMBEDDER__DIMENSIONS: "1536"
        run: go run ./cmd/orchestrator migrate up

      # -p 1: the two packages share one database and both reshape it (see
      # above), so their test binaries must not overlap. Package order is the
      # sorted import path, so the adapter tests run against the migrated schema
      # first and the split test tears it down last.
      #
      # A Postgres test that SKIPS in CI is a failure, not a pass: every helper
      # skips on a missing/unreachable/non-disposable DSN, and that skip is
      # exactly how these tests stayed silent for the life of the workflow. The
      # scan fails the job if the log carries any of the helpers' skip messages
      # (`go test -v` prints the message BEFORE the `--- SKIP` line, so this
      # matches the messages, not the marker), and asserts one canary from the
      # adapter package actually passed. A new Pg helper must keep "PG_TEST_DSN"
      # in its skip message to stay covered.
      - name: Gate — Postgres adapter and migrations under the race detector
        shell: bash
        env:
          PG_TEST_DSN: postgres://cambrian:cambrian@localhost:5432/cambrian_test?sslmode=disable
        run: |
          go test -race -p 1 -v ./internal/infrastructure/postgres/... ./internal/migrate/... 2>&1 \
            | tee "$RUNNER_TEMP/go-test-pg.log"
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E 'PG_TEST_DSN (not set|has no database name)|refusing to run the document-split migration' \
               "$RUNNER_TEMP/go-test-pg.log"; then
            echo "FAIL: Postgres tests skipped in CI (see the lines above); PG_TEST_DSN must reach the service database"
            exit 1
          fi
          if ! grep -qE '^\s*--- PASS: TestBindDelivery_RoundTrips ' "$RUNNER_TEMP/go-test-pg.log"; then
            echo "FAIL: canary TestBindDelivery_RoundTrips did not pass — the Postgres tests are not running"
            exit 1
          fi
          echo "PASS: no Postgres test skipped; canary TestBindDelivery_RoundTrips ran"

      - name: Gate — SystemHarness integration
        run: make integration

      - name: Gate — chaos scenarios
        run: make chaos

      # No `make bench-micro` here: the micro benchmarks live in internal/benchmarks/,
      # which .gitignore keeps out of the OSS repo (ADR-0057; decisions/no-benchmark-in-oss).
      # A clean checkout cannot have them, so the step could only ever fail.

  # Vendored-contract drift. operator.proto is copied into ui/ (and the premium and
  # benchmark trees carry their own vendored copies; cli/ no longer exists), and there
  # was nothing checking that the copies kept up: core gained the entire
  # GetDocument RPC and neither consumer received it, so the console could not
  # resolve a document id to its body and nothing reported it.
  #
  # Needs the sibling repositories, hence the extra checkouts. If they are private,
  # SIBLING_CHECKOUT_TOKEN must grant read access — the job fails loudly rather
  # than skipping, because a contract gate that quietly does not run is worse than
  # no gate at all.
  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cambrian-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cambrian-core
      - name: Checkout cambrian-premium (owns the plugin-plane protos)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cambrian-sh/premium
          path: cambrian-premium
          token: ${{ secrets.SIBLING_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout ui
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cambrian-sh/ui
          path: ui
          token: ${{ secrets.SIBLING_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout cambrian-benchmarks (vendors the chunker golden fixture)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cambrian-sh/benchmarking
          path: cambrian-benchmarks
          token: ${{ secrets.SIBLING_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Gate — vendored protos match their source of truth
        working-directory: cambrian-core
        run: make proto-sync-check

  # Lint. Split from `verify` so a style finding never masks a failing test, and
  # scoped to what THIS branch introduced (`--new-from-rev`): the tree carried ~131
  # pre-existing findings when the config landed, and a gate that is red on arrival
  # gets switched off rather than fixed. New code is held to the full standard.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # --new-from-rev diffs against the base branch, so the full history and
          # the base ref must both be present. A shallow clone reports every
          # pre-existing finding as new and the job is red for the wrong reason.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gate — lint (new findings only)
        # v7 is the first action major that runs golangci-lint v2; v6 refuses the
        # v2.x version string outright, so this job never ran a lint until 2026-10-31.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --new-from-rev=origin/${{ github.base_ref || github.event.repository.default_branch }} --timeout=5m

  # Goroutine-leak detection. Split from `verify` because the Makefile puts it in
  # `nightly`, not `per-pr` — it runs here on pushes to main only, so PRs stay fast
  # while regressions still get caught before they age.
  leak:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gate — goroutine leaks
        run: make leak

      # Advisory, not a gate. `deadcode` cannot see cross-module callers, so
      # app/plugin.go's Registry.* (the premium plugin API) always reports as
      # unreachable; failing on that would be wrong. Printed so the count is
      # visible in the log and a jump gets noticed.
      - name: Report — unreachable functions
        continue-on-error: true
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          "$(go env GOPATH)/bin/deadcode" ./cmd/... | tee /tmp/deadcode.txt
          echo "unreachable functions: $(wc -l < /tmp/deadcode.txt)"
