# Keeps the SHA-pinned actions in .github/workflows current. Every `uses:` is
# pinned to a full commit (2026-10-31 audit, T-20261031-github-actions-are-pinned-
# by-major-tag-not-sha); Dependabot bumps the SHA and the trailing version comment
# together, so the pin never silently rots into an old release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
