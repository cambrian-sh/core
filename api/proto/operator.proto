syntax = "proto3";

package cambrian;

option go_package = "core/api/proto";

import "google/protobuf/timestamp.proto";

// OperatorConsole is the operator-plane service for the Cambrian UI (ADR-0047).
// It is distinct from the agent-facing Orchestrator/AgentService: its audience
// is a human Operator/Viewer, not an agent (no x-agent-id principal). This file
// holds the sequenced event feed (issue 0047-01); snapshots, commands, and auth
// are added by later slices.
service OperatorConsole {
  // Login authenticates a human operator (username/password) and returns a
  // token bound to {principal, role}. The only unauthenticated RPC. ADR-0047 D13.
  rpc Login(LoginRequest) returns (LoginResponse);

  // StreamEvents drains the sequenced operator feed. The client resumes from
  // last_seq; every OperatorEvent carries a global monotonic seq (the cursor).
  rpc StreamEvents(SubscribeRequest) returns (stream OperatorEvent);

  // Snapshot returns bounded live operational state (plans in flight, sessions)
  // stamped with a lower-bound as_of_seq. The client resumes StreamEvents from
  // as_of_seq+1; idempotent absolute-state events make the overlap harmless.
  // Large/historical data is NOT here — paged read RPCs serve it. ADR-0047 D6/D8.
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);

  // SetToolGrant grants or revokes a system tool for an agent (Operator-only).
  // Idempotent (command_id), mandatory reason, audited. ADR-0047 D7/D15.
  rpc SetToolGrant(SetToolGrantRequest) returns (CommandAck);

  // QueryAudit reads the operator_audit log, filtered + paginated. Read RPC
  // (any authenticated role). Never folded into Snapshot. ADR-0047 D8/0047-08.
  rpc QueryAudit(QueryAuditRequest) returns (QueryAuditResponse);

  // ResolveHITL approves/rejects a raised HITL intervention (Operator-only).
  // Idempotent on the intervention id via command_id. ADR-0047 D11/0047-09.
  rpc ResolveHITL(ResolveHITLRequest) returns (CommandAck);

  // PauseSession / ResumeSession steer a live execution via the control hub AND persist
  // the session's lifecycle status, so the operator console's state reflects the command
  // (Phase 2). Before this they only signalled an in-memory executor, so a paused session
  // still reported "active" and could never be resumed from the console.
  rpc PauseSession(SessionCommandRequest) returns (CommandAck);
  rpc ResumeSession(SessionCommandRequest) returns (CommandAck);

  // CloseSession seals a session (→ completed). It is the terminator the lifecycle never
  // had: without it nothing ever left "active", so episodic consolidation (ADR-0012/0030)
  // was gated on a state no code could reach. Idempotent via command_id; audited.
  rpc CloseSession(SessionCommandRequest) returns (CommandAck);

  // Remaining mutations (Operator-only, idempotent, audited). ADR-0047 0047-07.
  rpc TagMemory(TagMemoryRequest) returns (CommandAck);
  rpc SetScope(SetScopeRequest) returns (CommandAck);
  rpc RegisterSkill(RegisterSkillRequest) returns (CommandAck);
  rpc RegisterMCP(RegisterMCPRequest) returns (CommandAck);
  rpc TriggerConsolidation(TriggerConsolidationRequest) returns (CommandAck);

  // SetRuntimeConfig hot-applies numeric runtime tunables (e.g. the Stage-A blend
  // weights) to the live kernel WITHOUT a restart — the automated-tuning seam
  // (ADR-0054). Idempotent (command_id), mandatory reason, audited, Operator-only.
  // Ephemeral: edits live in memory; config.json stays the boot default.
  rpc SetRuntimeConfig(SetRuntimeConfigRequest) returns (CommandAck);

  // Chat & steer (Operator-only, audited). ADR-0047 0047-10.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc SendMessage(SendMessageRequest) returns (CommandAck);
  rpc InjectCorrection(InjectCorrectionRequest) returns (CommandAck);

  // ── Conversations — the OSS chat lane (ADR-0084 D9). Distinct from CreateSession/
  // SendMessage above, which drive the TASK planner: a conversational turn is owned by a
  // single agent loop on the kernel's chat worker pool and is NEVER decomposed into a plan
  // (ADR-0080). SendTurn is synchronous — it returns the agent's reply message. The owner
  // of a conversation is the resolved operator principal, never the request body.
  // Capability "chat", advertised only when the chat lane is wired
  // (execution.chat_pool_size > 0 + a conversation store); OSS otherwise ⇒ Unimplemented.
  rpc OpenConversation(OpenConversationOpRequest) returns (OpenConversationOpResponse);
  rpc SendTurn(SendTurnOpRequest) returns (SendTurnOpResponse);
  rpc CloseConversation(CloseConversationOpRequest) returns (CommandAck);
  // Read RPCs (no command_id). ListConversations enumerates the calling operator's own
  // conversations (most recently updated first) for a ChatGPT-style sidebar;
  // ListConversationMessages returns one conversation's transcript, ordered, after a seq.
  rpc ListConversations(ListConversationsOpRequest) returns (ListConversationsOpResponse);
  rpc ListConversationMessages(ListConversationMessagesOpRequest) returns (ListConversationMessagesOpResponse);

  // ── ADR-0047 Amendment A2 (CORE-OPS-1): operator-plane read/exec/approval
  // surface. Distinct messages from the agent-plane equivalents (D1): the CLI
  // must never carry an x-agent-id principal.

  // Paged reads (any authenticated role; never folded into Snapshot). A2.1/D8.
  rpc ListTools(ListToolsOpRequest)     returns (ListToolsOpResponse);
  rpc ListSkills(ListSkillsOpRequest)   returns (ListSkillsOpResponse);
  rpc QueryMemory(QueryMemoryRequest) returns (QueryMemoryResponse);

  // ListDocuments enumerates ingested documents by ROW, not by relevance.
  //
  // QueryMemory is semantic: it answers "find the document that says X". That is the
  // wrong instrument for classification, which asks "which of my documents have no
  // labels?" — a question with no query text, because the operator does not yet know
  // what those documents say. Access policy acts only on labels, so an unlabelled
  // document is not denied, it is INVISIBLE to the policy model; without an
  // enumeration there was no way to find one except by already knowing its contents.
  //
  // Reads the `documents` table directly (small, GIN-indexed on tags). Documents are
  // an OSS concept — the store owns them with or without the policy plugin — so this
  // lives on the OSS plane rather than behind access-policy. Read RPC (any
  // authenticated role, no command_id).
  rpc ListDocuments(ListDocumentsOpRequest) returns (ListDocumentsOpResponse);

  // GetDocument fetches ONE document by id, body included.
  //
  // The keyed read the memory lane never had. ListDocuments above is keyed but
  // returns a listing row — "no body, no chunks" by its own contract — and
  // QueryMemory returns the body but is RANKED. Nothing joined them, so resolving
  // an id to its text meant searching semantically for an opaque token and hoping
  // it ranked. That is not a retrieval-quality problem a larger top-k fixes: there
  // is no question to rank against. It was a missing primitive.
  //
  // Two callers need it. A drift alert cites a message id, and a console that
  // cannot open that message shows a citation nobody can follow. And a watch whose
  // signal carries REFERENCES ONLY (the ingress contract) must resolve the
  // reference to content it can read — which is the property that makes a replayed
  // signal resolve today's document rather than a stale copy in the payload.
  rpc GetDocument(GetDocumentOpRequest) returns (GetDocumentOpResponse);

  // AnswerMemory (ADR-0081) runs the agentic retrieval loop and returns a GROUNDED
  // composed answer with inline [n] citation markers, plus the evidence each marker
  // resolves to. Distinct from QueryMemory's single-pass evidence lane: this is a
  // read that synthesizes (no auction, no mutation, no x-agent-id principal). Gated
  // on the "memory-answer" capability; OSS / agentic-disabled builds return
  // Unimplemented.
  rpc AnswerMemory(AnswerMemoryRequest) returns (AnswerMemoryResponse);

  // Tool permission management: bound an existing grant with a resource policy
  // (Operator-only, idempotent, audited). A2.3.
  rpc SetToolPolicy(SetToolPolicyRequest) returns (CommandAck);

  // Operator-triggered tool execution at ScopeSystem — a deliberate grant
  // bypass, audited, dangerous tools also emit a feed event (Operator-only). A2.2.
  rpc ExecuteTool(ExecuteToolOpRequest) returns (ExecuteToolOpResponse);

  // Memory ingest through the kernel ingest path (operator as Author; never a
  // raw store write). Idempotent on command_id (Operator-only, audited). A2.4.
  rpc IngestMemory(IngestMemoryOpRequest) returns (IngestMemoryOpResponse);

  // Tool-approval stream mirroring the ADR-0039 dangerous-tool approval request
  // (Operator-only). Resolve reuses ResolveHITL over the shared ApprovalHub
  // id-space. A2.5.
  rpc WatchToolApprovals(SubscribeRequest) returns (stream ApprovalOp);

  // ── Watch surfaces — PREMIUM capability-gated (D14/A2.6). The proto lives in
  // OSS in full (defining ≠ implementing); OSS handlers return Unimplemented and
  // the WatchTriggered class never publishes. Advertised only on premium builds.
  rpc ListWatches(ListWatchesOpRequest)       returns (ListWatchesOpResponse);
  rpc RegisterWatch(RegisterWatchOpRequest)   returns (CommandAck);
  rpc DeleteWatch(DeleteWatchOpRequest)       returns (CommandAck);
  rpc SetWatchActive(SetWatchActiveOpRequest) returns (CommandAck);

  // ListWatchDeadLetters reads reactive actions that could not be delivered — a
  // failed action or a journal signal that expired before it ran (REACT-01 /
  // ADR-0061). Read RPC (no command_id). Capability "watch-deadletter", advertised
  // on premium builds; OSS returns an empty list (no reactive engine writes them).
  rpc ListWatchDeadLetters(ListWatchDeadLettersOpRequest) returns (ListWatchDeadLettersOpResponse);

  // ── Reactive pipelines (contract 0087, ADR-0114 D33/D34) ──────────────────
  //
  // A pipeline is not a watch. A watch is one condition and a list of arms; a
  // pipeline is an authored, versioned GRAPH with typed ports, declared
  // discards and a durable execution store behind it. They are listed
  // separately because collapsing them would force one shape to lie about the
  // other — a watch has no revisions and no nodes, a pipeline has no single
  // condition.
  //
  // Every ingress created through the Ingress Studio owns one, generated from
  // its mapping and armed with the ingress (D34). An ingress that has not been
  // armed has NO armed pipeline, and that is a normal state, not a fault.
  //
  // Read RPC (no command_id). Capability "reactive-pipelines", advertised on
  // premium builds; OSS returns an empty list.
  rpc ListPipelines(ListPipelinesOpRequest) returns (ListPipelinesOpResponse);

  // DryRunPipeline replays captured deliveries through the compiled plan with
  // every effect shadowed: every gate, branch, aggregate and key derivation runs
  // for real, and nothing reaches the world.
  //
  // The substitution is at the DISPATCHER and nowhere earlier, which is what
  // makes the report worth reading — effect-key derivation, projection identity
  // and barrier obligations all execute, so a duplicate key surfaces here rather
  // than as missing knowledge weeks later.
  //
  // Distinct from BacktestWatch, which asks a different question: a dry run asks
  // what this would do to what is arriving now; a backtest replays journaled
  // history to argue for a change. Neither ever executes an arm.
  //
  // Read RPC (no command_id) — it performs nothing. Capability
  // "reactive-pipelines"; OSS REFUSES by name rather than answering with an
  // empty report, because "nothing would happen" is not a true answer on a build
  // that cannot run one.
  rpc DryRunPipeline(DryRunPipelineOpRequest) returns (DryRunPipelineOpResponse);

  // GetPipeline returns one authored revision as authored, plus what the
  // compiler says about it right now.
  //
  // The refusals travel with the READ, not only with an edit: a stored revision
  // can stop compiling without anyone touching it — a ceiling lowered, a node
  // kind retired — and a console that validated only on edit would offer to
  // publish it.
  //
  // Read RPC (no command_id). Capability "reactive-pipelines".
  rpc GetPipeline(GetPipelineOpRequest) returns (GetPipelineOpResponse);

  // ListNodeItems returns what actually reached one node, newest first.
  //
  // The inspector could say a node RAN and never what ran through it: an
  // operator watching their own data flow saw `save_to_memory → out "effect
  // confirmed"` and not one value that landed. Every task already carried its
  // input envelope, its result and its evidence — this is the read that was
  // missing, not the data.
  //
  // Read RPC (no command_id). Capability "reactive-pipelines".
  rpc ListNodeItems(ListNodeItemsOpRequest) returns (ListNodeItemsOpResponse);

  // ValidatePipeline compiles a graph document WITHOUT storing it, so an editor
  // can ask on every change.
  //
  // Deliberately separate from the lifecycle's own validate step, which
  // transitions a stored revision. This one has no side effect of any kind: an
  // editor that could accidentally publish is a worse editor, and the safest
  // way to guarantee it cannot is to give it an RPC that has no power to.
  //
  // Read RPC (no command_id) — it stores nothing.
  rpc ValidatePipeline(ValidatePipelineOpRequest) returns (ValidatePipelineOpResponse);

  // SavePipeline stores an edited graph as a new DRAFT revision.
  //
  // It can create a draft and nothing else. Publishing and arming stay on the
  // lifecycle, where each is an explicit act with its own gate — a canvas that
  // could arm what it had just drawn would collapse four deliberate steps into
  // one mouse click.
  //
  // A graph that breaks rules is still stored. An operator mid-edit needs to
  // keep their work, and a draft cannot run; what refusals block is publishing.
  //
  // Capability "reactive-pipelines".
  rpc SavePipeline(SavePipelineOpRequest) returns (SavePipelineOpResponse);

  // TransitionPipeline moves ONE revision along its lifecycle: draft →
  // validated → published → armed; armed → published is the pause; retired
  // ends it (contract 0093).
  //
  // This is the button SavePipeline deliberately is not. Each gate still
  // holds — a revision that does not compile refuses to validate, publishing
  // requires validated, arming requires published and disarms the incumbent —
  // and a refusal names the gate in the registry's own words. `armed` walks a
  // draft through validate and publish on the way, because "make THIS live"
  // is one operator intent and answering it with two missing prerequisite
  // buttons would be a bare precondition, not an answer.
  //
  // Capability "pipeline-lifecycle".
  rpc TransitionPipeline(TransitionPipelineOpRequest) returns (TransitionPipelineOpResponse);

  // ── Kernel logs (contract 0082) ───────────────────────────────────────────
  //
  // OPERATOR-ONLY, both of them. A log line carries whatever the kernel happened
  // to write — ids, request shapes, sometimes content — and it bypasses the
  // access-policy plane entirely, so it is not filtered per principal the way a
  // memory read is. Until it can be, a Viewer does not get it. The auth gate
  // lists these explicitly because the convention there would otherwise open any
  // method named Query* to a Viewer by its spelling alone.
  //
  // Both read the kernel's in-process retention window, which is BOUNDED and
  // does not survive a restart. `LogWindowOp` travels with every response so a
  // console can state that rather than presenting a truncated window as the
  // whole story.
  rpc QueryLogs(QueryLogsOpRequest) returns (QueryLogsOpResponse);
  rpc TailLogs(TailLogsOpRequest) returns (stream LogRecordOp);

  // REACT-05 / ADR-0071: watch observability. GetWatchMetrics returns per-watch fire/
  // suppression/dry-run/dead-letter counters + mean condition latency. BacktestWatch
  // replays the signal journal through a candidate watch config and reports would-fires
  // WITHOUT acting. Capability "watch-observability"; premium (OSS ⇒ Unimplemented).
  rpc GetWatchMetrics(GetWatchMetricsOpRequest) returns (GetWatchMetricsOpResponse);
  rpc BacktestWatch(BacktestWatchOpRequest) returns (BacktestWatchOpResponse);

  // PreviewRoute (ROUTE-07 / ADR-0077) runs the Gatekeeper's L3 merit scoring over a
  // caller-supplied candidate set (inline synthetic profiles) for a step's required
  // capabilities, and returns the ranked funnel — WITHOUT the planner, an auction, or
  // agent execution. It is the gatekeeper-benchmark entry point: deterministic routing
  // data-generation + evaluation, under the active scorer arm (hand weights or the
  // ROUTE-07 learned scorer). Capability "route-preview"; nil-in-OSS ⇒ Unimplemented.
  rpc PreviewRoute(PreviewRouteOpRequest) returns (PreviewRouteOpResponse);

  // ExplainAccess (ADR-0085 D8) answers "why can / can't this principal reach this
  // resource?" WITHOUT performing the access. It is the gpresult / Azure "Check
  // access" analogue: the reply names the reason, the specific tag or effect
  // responsible, and which policy — linked where — contributed it.
  //
  // Explainability is not a debugging aid here. A fail-closed access model with
  // policy composition multiplies the ways to reach an empty result set by
  // accident, and an unexplained empty result is indistinguishable from "there is
  // no data". Capability "access-policy"; nil-in-OSS ⇒ Unimplemented, because an
  // unscoped deployment has no policy to explain.
  rpc ExplainAccess(ExplainAccessOpRequest) returns (ExplainAccessOpResponse);

  // ListClassificationTags (ADR-0085 D11) returns the controlled classification
  // vocabulary, so a policy UI offers SELECTION rather than free text. A free-text
  // tag field is a defect: a typo is the primary route to a scope that silently
  // matches nothing. Capability "access-policy"; nil-in-OSS ⇒ Unimplemented.
  rpc ListClassificationTags(ListClassificationTagsOpRequest) returns (ListClassificationTagsOpResponse);

  // ── Contract 0072 — the operator console's Wave 1 (ADR-0101 + UX refactor) ──

  // ListSessionCheckpoints reads the checkpoints written as a session executes.
  //
  // Checkpoints are keyed by RUN, not by session: a session accumulates many runs
  // and a step index only means anything relative to the plan of the run it was
  // taken against. A response therefore carries run_id on every row, and a
  // console must group by it — flattening a session's checkpoints into one
  // timeline offers a resume from the wrong plan.
  //
  // Read RPC (no command_id). OSS: served whenever a checkpoint store is wired.
  rpc ListSessionCheckpoints(ListSessionCheckpointsOpRequest) returns (ListSessionCheckpointsOpResponse);

  // ListMCPServers enumerates the external MCP servers this kernel consumes tools
  // from (ADR-0043), with live connection state.
  //
  // It exists because "0 MCP servers" and "this kernel cannot report MCP servers"
  // are different facts an operator must be able to tell apart, and before this
  // RPC the console could not: there was no read and no feed event, so the
  // surface listed zero on every deployment forever.
  rpc ListMCPServers(ListMCPServersOpRequest) returns (ListMCPServersOpResponse);

  // GetEmbeddingConfig reports the embedding model, its dimensions and the stored
  // vector count.
  //
  // The pairing matters more than the fields: changing the model WITHOUT
  // re-embedding leaves every stored vector meaningless and NOTHING errors —
  // retrieval starts returning near-random chunks and grounded answers stay
  // confidently wrong, citations and all. Any future model-change RPC must carry
  // the re-embed with it.
  rpc GetEmbeddingConfig(GetEmbeddingConfigOpRequest) returns (EmbeddingConfigOp);

  // ClassifyInput returns the ADR-0031 router's decision for a typed sentence
  // WITHOUT acting on it, so a console can show what is about to happen and offer
  // one click to overrule it.
  //
  // The classification vocabulary is FIVE values, not three: chat, plan, ingest,
  // watch, clarification. `ingest` is the one a client must not collapse into
  // another — it WRITES to memory, so rendering it as a read makes an operator
  // approve a write believing they approved a question.
  rpc ClassifyInput(ClassifyInputOpRequest) returns (ClassifiedInputOp);

  // ListGenerators reports the configured LLM generators (ADR-0042) with live
  // breaker state, and ListRoleAssignments which generator serves each system
  // organ (planner / verifier / router / interview / memory).
  //
  // No credential is ever returned: a generator carries key_configured and
  // key_last_four only. There is deliberately no GetGeneratorKey — a console that
  // can display a credential leaks it to whoever is looking at the screen, to a
  // screen recording, and to whatever logged the response, none of which is
  // recoverable.
  rpc ListGenerators(ListGeneratorsOpRequest) returns (ListGeneratorsOpResponse);
  rpc ListRoleAssignments(ListRoleAssignmentsOpRequest) returns (ListRoleAssignmentsOpResponse);

  // TestGenerator makes ONE real call against a configured generator's live
  // endpoint.
  //
  // The field that earns this RPC is model_served: the model string the endpoint
  // ECHOED BACK, not the one that was asked for. An endpoint answering happily
  // with a different build is the most common misconfiguration in this space and
  // nothing else in the console would ever reveal it.
  rpc TestGenerator(TestGeneratorOpRequest) returns (GeneratorTestResultOp);

  // GetConfigSchema is the READ half of the runtime-config surface.
  //
  // SetRuntimeConfig has been able to write a tunable since contract 0047 and
  // nothing could read one back, so a console could only display the kernel's
  // documented defaults and label them a guess.
  //
  // value_source is the field that earns this RPC. It closes the worst
  // configuration bug there is — you change a value, it saves, and nothing
  // happens because something upstream pins it — by naming the layer actually
  // supplying each key, so a pinned field renders read-only NAMING THE PIN.
  //
  // Read RPC (no command_id).
  rpc GetConfigSchema(GetConfigSchemaOpRequest) returns (ConfigSchemaOp);

  // SetConfig durably records operator configuration intent (ADR-0101).
  //
  // Distinct from SetRuntimeConfig, and both must survive. SetRuntimeConfig is
  // the ADR-0054 automated-tuning seam: ephemeral, keyed by param name, and
  // written by a tuner that must NOT leave permanent marks on a deployment.
  // SetConfig is a human saying "make it this, and keep it this way" — it is
  // keyed by config path and outlives the process.
  //
  // Per-key outcomes rather than one ack, because a partial set can partly
  // succeed. Collapsing that into a single ok/fail hides WHICH field did not
  // take, which is the state an operator most needs to see.
  //
  // Mutating: command_id + reason, audited, Operator-only.
  rpc SetConfig(SetConfigOpRequest) returns (SetConfigOpResponse);

  // DeleteConfig removes a stored override, reverting the key to whatever the
  // layers beneath the store supply.
  //
  // It is not a convenience. Once a durable write path exists, "put it back" has
  // no other expression: writing the old value over the top leaves the key
  // pinned by the store, so the file or default underneath it stays overridden
  // and a later change to that file silently does nothing.
  rpc DeleteConfig(DeleteConfigOpRequest) returns (SetConfigOpResponse);

  // SetGeneratorKey / ClearGeneratorKey store an LLM provider credential
  // (ADR-0101 D5). Write-only by construction: there is no getter anywhere on
  // this plane, and the stored value is encrypted at rest.
  //
  // Mutating: command_id + reason, audited. The key itself is never echoed back
  // and never appears in the audit record — only the fact that one was set.
  rpc SetGeneratorKey(SetGeneratorKeyOpRequest) returns (SetConfigOpResponse);
  rpc ClearGeneratorKey(ClearGeneratorKeyOpRequest) returns (CommandAck);

  // SaveGenerator / RemoveGenerator are the WRITE half of the generator surface
  // (contract 0083). They land on the ADR-0101 store, which is what the read
  // half's comment has been waiting for — editing configs/providers.json from
  // the operator plane is the thing that store exists to stop.
  //
  // The stored value is the WHOLE generator list, not one entry, because the
  // store layer merges per key and koanf replaces a list wholesale: writing a
  // single generator would delete every other one. Save therefore reads the
  // effective list, applies the edit, and stores the result.
  //
  // The effect is restart_required, and that is reported rather than smoothed
  // over: generators are constructed once, at boot, into the provider's routing
  // table. Claiming `live` here would leave an operator watching traffic go to a
  // model they believe they replaced.
  //
  // Mutating: command_id + reason, audited, Operator-only.
  rpc SaveGenerator(SaveGeneratorOpRequest) returns (SetConfigOpResponse);
  rpc RemoveGenerator(RemoveGeneratorOpRequest) returns (SetConfigOpResponse);

  // SetRoleAssignment binds a system organ (planner / verifier / router /
  // interview / memory) to the generator that serves it (contract 0096). The
  // WRITE half of ListRoleAssignments, landing on the ADR-0101 store like the
  // generator writes above.
  //
  // The effect is `live`: the provider resolves roles per call, so the next
  // call the organ makes goes to the new generator. Nothing in flight moves.
  //
  // The write is REFUSED when generator_id does not name a configured
  // generator. A dangling role is a state the runtime tolerates (it falls back
  // to the default and ListRoleAssignments reports resolved=false), but it is
  // never a state an operator asked for — accepting the typo would silently
  // route an organ to the default while the console shows the name they typed.
  //
  // Mutating: command_id + reason, audited, Operator-only.
  rpc SetRoleAssignment(SetRoleAssignmentOpRequest) returns (SetConfigOpResponse);

  // SaveMCPServer / RemoveMCPServer are the WRITE half of ListMCPServers
  // (contract 0097). They land on the ADR-0101 store — the whole server list
  // under one key, for the same koanf reason the generator list does — and,
  // unlike generators, apply LIVE: a save arms the server's health/reconnect
  // loop immediately (tools appear via the ADR-0044 sink as soon as the server
  // answers; an unreachable one is retried with backoff, exactly like a server
  // that was down at boot), and a removal closes the session and withdraws its
  // tools at once. The reported effect is therefore `live`, with `connected`
  // still a separate fact the list read answers.
  //
  // Mutating: command_id + reason, audited, Operator-only.
  rpc SaveMCPServer(SaveMCPServerOpRequest) returns (SetConfigOpResponse);
  rpc RemoveMCPServer(RemoveMCPServerOpRequest) returns (SetConfigOpResponse);

  // SetMCPServerToken / ClearMCPServerToken store the server's static credential
  // (ADR-0101 D5 pattern — write-only, encrypted at rest, never echoed, never in
  // the audit record). Setting a token also BOUNCES the server's connection when
  // one is live: credentials are injected at connect time, so without the bounce
  // a healthy session would keep using the old token indefinitely and "saved"
  // would mean nothing observable.
  rpc SetMCPServerToken(SetMCPServerTokenOpRequest) returns (SetConfigOpResponse);
  rpc ClearMCPServerToken(ClearMCPServerTokenOpRequest) returns (CommandAck);

  // TestMCPServer dials the SUBMITTED spec once — connect, list tools,
  // disconnect — without touching any live session for the same id. It takes a
  // spec rather than an id so a config can be tested BEFORE it is saved; the
  // tool names it returns are what the server actually advertises, which is the
  // fact nothing else on this plane can reveal before committing.
  rpc TestMCPServer(TestMCPServerOpRequest) returns (MCPServerTestResultOp);

  // SubmitPlan runs an OPERATOR-AUTHORED plan, skipping the planner.
  //
  // Every field of AuthoredStepOp maps onto domain.Step, so this is a face for
  // the plan schema rather than a second one. Notably the soft/hard agent pin is
  // already two fields in the domain (ADR-0096): preferred_agent goes first but
  // ranking still runs behind it, agent_pin makes the step DIE if that agent is
  // unavailable. Collapsing them would lose the distinction the design turns on.
  //
  // dry_run validates and estimates WITHOUT creating a session, starting a plan
  // or spending anything. It is not a courtesy: an operator-authored DAG can
  // carry a dependency cycle, which the planner path cannot produce, so the
  // validation it performs has no other home.
  //
  // Mutating: command_id + reason, audited, Operator-only.
  rpc SubmitPlan(SubmitPlanOpRequest) returns (SubmitPlanOpResponse);

  // GetReactiveBudget reports the reactive plane's running totals against its
  // caps (contract 0074).
  //
  // ReactiveBudgetOp on the feed is a SHED event — it fires once the plane is
  // already dropping work. This is the approach to that line, which is what lets
  // an operator act before the shedding starts rather than after.
  //
  // Read RPC (no command_id). Premium; OSS returns Unimplemented.
  rpc GetReactiveBudget(GetReactiveBudgetOpRequest) returns (GetReactiveBudgetOpResponse);

  // GetTokenSeries returns recent hourly token usage for the spend sparkline
  // (contract 0075).
  //
  // Tokens only. There is no cost, currency or rate field anywhere in the
  // response: a completion response carries token COUNTS and never a price, so a
  // money figure would be one the kernel invented from an unreconciled rate —
  // a wrong-units bug rather than a rounding one.
  //
  // Read RPC (no command_id).
  rpc GetTokenSeries(GetTokenSeriesOpRequest) returns (GetTokenSeriesOpResponse);

  // ProposePlan turns a goal into a plan WITHOUT committing to it.
  //
  // The load-bearing property is what it does NOT do: no session is created, no
  // plan is started, nothing is spent. `CreateSession` + `SendMessage` commit;
  // this is where work is SHAPED, and the session begins on approval. A console
  // that promises "nothing committed yet" needs an RPC that honours it.
  //
  // A vague goal comes back as QUESTIONS rather than a bad plan. Planner output
  // is the ceiling on routing quality (ADR-0100 D3), so vagueness cannot be
  // recovered downstream — asking is cheaper than planning badly, and that makes
  // the questions a feature rather than a delay.
  //
  // Read-shaped: no command_id, because nothing is mutated.
  rpc ProposePlan(ProposePlanOpRequest) returns (ProposePlanOpResponse);

  // ExplainAccessBatch answers many access questions in ONE call, so a
  // reachability matrix can be authoritative instead of predicted.
  //
  // It exists to delete a client-side re-implementation. A console rendering an
  // NxM grid cannot make NxM round trips, so it evaluates the policy set itself —
  // which is a SECOND implementation of access-control logic, and a wrong
  // "allowed" cell there is a security-shaped bug rather than a cosmetic one.
  // Every cell answered by this RPC is answered by the same decision point the
  // enforcement path asks, so the two cannot disagree.
  //
  // Read RPC (no command_id). Bounded server-side; see the request's `queries`.
  rpc ExplainAccessBatch(ExplainAccessBatchOpRequest) returns (ExplainAccessBatchOpResponse);

  // GetBlastRadiusPreview reports what a scope or grant mutation would do to
  // AGENTS and IN-FLIGHT PLANS, before it is applied.
  //
  // Distinct from the policy blast radius the scope screens already compute:
  // that one answers "how many documents does this rule touch?" from the
  // document listing. This one answers "whose reach changes, and which running
  // plans have to be re-evaluated?" — a different question with a different
  // source, and the only one that can tell an operator they are about to widen
  // an agent mid-plan.
  //
  // An EMPTY preview understates the radius, which is the one direction this
  // number must never be wrong in. A kernel that cannot compute it returns
  // Unimplemented rather than an empty answer.
  //
  // Read RPC (no command_id): it previews, it does not apply.
  rpc GetBlastRadiusPreview(BlastRadiusPreviewOpRequest) returns (BlastRadiusPreviewOp);

  // RetryWatchDeadLetter replays one dead-lettered reactive action.
  //
  // Safe because REACT-01 (ADR-0061) already records the idempotency key with the
  // dead letter, so the replay runs under the original key and a double-click
  // cannot double-fire. Mutating: command_id + reason, audited. Premium
  // (capability "watch-deadletter"); OSS returns Unimplemented.
  rpc RetryWatchDeadLetter(RetryWatchDeadLetterOpRequest) returns (CommandAck);
}

message CreateSessionRequest {
  string command_id = 1;
  string reason = 2;
  string goal = 3;
  string parent_id = 4;
}

message CreateSessionResponse {
  string command_id = 1;
  bool deduped = 2;
  string session_id = 3;
}

message SendMessageRequest {
  string command_id = 1;
  string reason = 2;
  string session_id = 3;
  string text = 4;
}

message InjectCorrectionRequest {
  string command_id = 1;
  string reason = 2;
  string session_id = 3;
  string instruction = 4; // lands inside the running plan (pause→replan→hot-swap→resume)
}

// ── Conversations (ADR-0084 D9). conversation_id is CLIENT-supplied (the natural key that
// makes OpenConversation idempotent and keys every later turn), mirroring the chat manager.
message OpenConversationOpRequest {
  string command_id = 1;     // idempotency key for the audit entry
  string reason = 2;         // mandatory; recorded in the audit entry
  string conversation_id = 3; // client-chosen stable id
  string title = 4;
  // profile selects the recall + scope posture (ADR-0084 D7): "operator" | "employee" |
  // "customer". Empty defaults to "operator" (full recall) on this plane.
  string profile = 5;
  // policy is an optional system/policy prompt threaded into every turn of this conversation.
  string policy = 6;
}

message OpenConversationOpResponse {
  string command_id = 1;
  bool deduped = 2;          // true when the conversation already existed (a retry)
  string conversation_id = 3;
}

message SendTurnOpRequest {
  string command_id = 1;     // idempotency key; a retry returns the original reply, no re-run
  string reason = 2;
  string conversation_id = 3;
  string text = 4;           // the user's message
}

message SendTurnOpResponse {
  string command_id = 1;
  bool deduped = 2;
  MessageOp reply = 3;       // the agent's reply, already persisted
}

message CloseConversationOpRequest {
  string command_id = 1;
  string reason = 2;
  string conversation_id = 3;
}

message ListConversationsOpRequest {
  int32 limit = 1;           // <= 0 means a server default
}

message ListConversationsOpResponse {
  repeated ConversationOp conversations = 1;
}

// ConversationOp is a conversation summary for the sidebar (no messages).
message ConversationOp {
  string id = 1;
  string title = 2;
  string status = 3;         // "open" | "closed"
  string profile = 4;        // "operator" | "employee" | "customer"
  string updated_at = 5;     // RFC3339
}

message ListConversationMessagesOpRequest {
  string conversation_id = 1;
  int64 after_seq = 2;       // return messages with seq strictly greater than this (0 = all)
  int32 limit = 3;           // <= 0 means no limit
}

message ListConversationMessagesOpResponse {
  repeated MessageOp messages = 1;
}

// MessageOp is one persisted conversation turn.
message MessageOp {
  string id = 1;
  string conversation_id = 2;
  int64 seq = 3;             // monotonic per-conversation ordering key
  string role = 4;           // "user" | "agent" | "system"
  string content = 5;
  string created_at = 6;     // RFC3339
}

message TagMemoryRequest {
  string command_id = 1;
  string reason = 2;
  string doc_id = 3;
  string tag = 4;
  bool add = 5; // true = apply tag, false = remove
}

message SetScopeRequest {
  string command_id = 1;
  string reason = 2;
  string agent_id = 3;
  repeated string required_tags = 4;
  repeated string any_of_tags = 5;
  repeated string forbidden_tags = 6;
}

message RegisterSkillRequest {
  string command_id = 1;
  string reason = 2;
  string name = 3;
  string description = 4;
  string instructions = 5;
  repeated string tool_grants = 6;
  repeated string scope_tags = 7;
}

message RegisterMCPRequest {
  string command_id = 1;
  string reason = 2;
  string name = 3;
  string command = 4; // stdio command, OR
  string url = 5;     // streamable-http URL
}

message TriggerConsolidationRequest {
  string command_id = 1;
  string reason = 2;
  string scope = 3; // optional scope hint; empty = full
}

message SetRuntimeConfigRequest {
  string command_id = 1;
  string reason = 2;
  // params maps a numeric tunable name → value, e.g. "blend_weight_cosine": 0.4.
  // Unknown keys are reported back in CommandAck-side logs and ignored; partial
  // sets merge over the current live values.
  map<string, double> params = 3;
}

message ResolveHITLRequest {
  string command_id = 1;
  string reason = 2;
  string intervention_id = 3;
  bool approve = 4;
}

message SessionCommandRequest {
  string command_id = 1;
  string reason = 2;
  string session_id = 3;
}

message QueryAuditRequest {
  string actor = 1;
  string target_type = 2;
  string target_id = 3;
  string action_type = 4;
  int32 limit = 5; // 0 ⇒ a server default
}

message QueryAuditResponse {
  repeated AuditOp entries = 1;
}

// CommandAck is the result of a mutating command. deduped=true means the
// command_id was already applied (idempotent retry) — no second mutation.
message CommandAck {
  string command_id = 1;
  bool deduped = 2;
}

message SetToolGrantRequest {
  string command_id = 1; // client-generated idempotency key (UUID)
  string reason = 2;     // mandatory; recorded in the audit entry
  string agent_id = 3;
  string tool_name = 4;
  bool granted = 5;      // true = grant, false = revoke
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1; // present on every subsequent call as "authorization: Bearer <token>"
  string role = 2;  // "operator" | "viewer"
}

message SnapshotRequest {}

message SnapshotResponse {
  uint64 as_of_seq = 1;             // lower-bound cursor; resume StreamEvents from as_of_seq+1
  repeated PlanInFlightOp plans = 2;
  repeated SessionSummaryOp sessions = 3;
  // Capability + version handshake (ADR-0047 D14): lets the UI hide unsupported
  // surfaces and surface version skew as a first-class state.
  string kernel_version = 4;
  string contract_version = 5;
  // capabilities enumerates the surfaces this build supports so the UI hides the
  // rest (ADR-0047 D14). OSS: feed, snapshot, commands, steering, audit,
  // tools-read, tools-manage, skills-read, memory-read, memory-ingest, tool-exec,
  // tool-approvals, routing-trace (ROUTE-02 selection funnel),
  // chat (ADR-0084 D9 conversation lane — advertised only when the chat
  // worker pool is enabled, execution.chat_pool_size > 0), document-listing
  // (contract 0070 — ListDocuments enumerates documents by row, including the
  // unlabelled-only filter; advertised only when a store backs it, so a console
  // never renders a document browser against a kernel that answers Unimplemented).
  // Premium adds: watches-read,
  // watches-crud (A2), watch-deadletter, reactive-backpressure, watch-condition-guard,
  // watch-observability, watch-schedule (REACT-06 cron-driven watches). route-preview
  // (ROUTE-07 gatekeeper scoring) is core. contract 0062 (ADR-0084 + ListConversations sidebar).
  repeated string capabilities = 6;
  // plugins enumerates every plugin this build DECLARED, registered or not, with
  // its own version line (ADR-0089). Capabilities tell the UI which surfaces
  // exist; this tells it which build produced them, so a console can detect
  // plugin-level skew the way it already detects contract skew. A plugin that
  // failed entitlement or has unmet dependencies still appears here — silence
  // about a plugin the operator paid for is the failure mode this closes.
  repeated PluginInfoOp plugins = 7;
}

// PluginInfoOp is one declared plugin as the kernel sees it (ADR-0082 D9 status,
// ADR-0089 on the wire). The kernel does not interpret capabilities or panels; it
// reports what the plugin declared.
message PluginInfoOp {
  string id = 1;                    // stable plugin key ("reactive", "authz")
  string display_name = 2;
  // version is the plugin's OWN version line, unrelated to contract_version.
  // A console pins what it was built against and warns when this differs.
  string version = 3;
  // state is one of: active, deps_unmet, not_entitled, expired,
  // licence_unverifiable (ADR-0082 D9, extended in contract 0072).
  // "expired" still serves — an entitlement inside its grace window.
  //
  // "licence_unverifiable" means the CHECK ITSELF failed, which fails closed: the
  // plugin is off, the operator's work is intact, and it starts on its own when
  // the check succeeds. It is a distinct state because rendering that as
  // "not_entitled" tells an operator they do not own something they paid for.
  // A client must treat any UNRECOGNISED state as unverifiable rather than as
  // not-entitled — that is the safe reading, and it is what lets an older console
  // degrade correctly against a newer kernel.
  string state = 4;
  // capabilities this plugin contributes to the handshake above.
  repeated string capabilities = 5;
  // panels this plugin contributes, so a console can enumerate surfaces it may
  // not have components for yet.
  repeated PluginPanelOp panels = 6;
  // reason is operator-facing detail when the plugin is not registered.
  string reason = 7;
  // missing lists required plugin ids unavailable in this deployment.
  repeated string missing = 8;
  // expires_at is the entitlement expiry (RFC3339), empty when not applicable.
  string expires_at = 9;
  // last_check_unix_ms is when the entitlement check last ran. It is what turns
  // "the licence could not be verified" into "…at 14:02", which is the difference
  // between a state an operator can act on and one they can only stare at.
  // 0 ⇒ never checked / not applicable.
  int64 last_check_unix_ms = 10;
}

message PluginPanelOp {
  string id = 1;
  string title = 2;
  string capability = 3;
}

message PlanInFlightOp {
  string session_id = 1;
  string plan_id = 2;
  int32 active_step = 3;
  string status = 4;
  string active_agent = 5;
  double cost_so_far = 6;
}

message SessionSummaryOp {
  string id = 1;
  string goal = 2;
  string status = 3;
}

message SubscribeRequest {
  // last_seq is the resume cursor — the highest seq the client has already seen.
  // 0 means "from the start of the retained window". ADR-0047 D9.
  uint64 last_seq = 1;
}

// OperatorEvent is the sequenced envelope drained from the spool. seq is the
// global monotonic cursor; ts is the sequencing time; session_id is empty for
// system-global events. The payload is an absolute-state delta. ADR-0047 D3/D5.
message OperatorEvent {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string session_id = 3;
  oneof payload {
    ResyncRequired resync = 9;
    AuctionEventOp auction = 10;
    AgentReadyOp agent_ready = 11;
    SessionDormantOp session_dormant = 12;
    SessionCompletedOp session_completed = 13 [deprecated = true]; // no producer since consolidation was removed
    MemoryPressureOp memory_pressure = 14;
    DaemonCrashedOp daemon_crashed = 15;
    WatchTriggeredOp watch_triggered = 16;
    MemoryWrittenOp memory_written = 17;
    HITLRaisedOp hitl_raised = 18;
    VerifierRoundOp verifier_round = 19;
    LLMHealthOp llm_health = 20;
    PlanStateOp plan_state = 21;
    AuditOp audit = 22;
    TokenChunkOp token = 23; // live-only lane; seq is 0 and is never replayed
    // DEPRECATED 2026-08-08 and never emitted. Its producer was the Scout, retired
    // 2026-08-07. Field number 24 is retained and must never be reused. See
    // ScoutUsefulnessOp below.
    ScoutUsefulnessOp scout_usefulness = 24 [deprecated = true];
    ReactiveBudgetOp reactive_budget = 25;   // REACT-02 / ADR-0062: backpressure shed event
    AgentStepOp agent_step = 26;             // agent-loop observability (query-thrash + poisoning)
    AgentLLMExchangeOp llm_exchange = 27;    // provider-tap: full prompt+completion of every agent reasoning turn (live-only)
    SessionStateOp session_state = 28;       // Phase 2: absolute session lifecycle state
    // ADR-0098 progress, on the OPERATOR feed (contract 0079).
    //
    // The progress channel delivers to an ingress-bound conversation — Telegram
    // gets "working on it, step 2 of 4" and the operator console got nothing,
    // because a console conversation has no delivery address. Progress was
    // computed and dropped.
    //
    // Live-only, like TokenChunkOp: seq is 0 and it is never replayed. It is a
    // STATUS LINE, not history — a replayed "working on it" for a turn that
    // finished an hour ago would be worse than no progress at all.
    ConversationProgressOp conversation_progress = 29;
    RetentionRunOp retention_run = 30;       // ADR-0102 A1: a retention/compaction pass deleted data
    PipelineMetersOp pipeline_meters = 31;   // ADR-0114 D37: live per-node counters
    PipelineStepOp pipeline_step = 32;       // ADR-0114 D38: one item through one node
  }
}

// PipelineStepOp is one item passing through one node — the flow view.
//
// Where PipelineMetersOp answers "how much and where is it piling up", this
// answers "what went where": which branch this delivery took, and what it
// carried.
//
// Live-only and never replayed, like a token chunk. Replaying a step from an
// hour ago into a flow view would show motion that is not occurring.
//
// RATE-CAPPED per pipeline by the emitter, because one event per node per item
// would drown the plane. `dropped` carries what was skipped since the last one
// sent, so a flow view that skips says so rather than misrepresenting the shape
// of the traffic.
//
// `payload` travels ONLY when tracing is enabled, and is truncated by the
// emitter with `payload_bytes` reporting the untruncated size. An item's value
// is the real data moving through the deployment: shipping it by default would
// make a diagnostic view an exfiltration surface, and a clipped payload must
// never be mistakable for a whole one.
message PipelineStepOp {
  string pipeline_id = 1;
  int32 revision = 2;
  string run_id = 3;
  // item_key identifies the item ACROSS steps, which is what makes a sequence
  // of these a trace rather than a list.
  string item_key = 4;
  string node = 5;
  string kind = 6;
  // port is the port it left by, empty when it did not leave by one.
  string port = 7;
  // outcome is "routed", "terminated" or "failed".
  string outcome = 8;
  // reason is the operator's own words for a declared discard, or the error.
  string reason = 9;
  int64 duration_ms = 10;
  string payload = 11;
  int32 payload_bytes = 12;
  int64 dropped = 13;
}

// PipelineMetersOp is a live per-node reading for one running pipeline.
//
// Live-only: process-local, never replayed, and reset by a restart. It describes
// what this kernel is doing NOW, which is the question a console cannot answer
// from an RPC read once when a tab opened.
//
// in_flight is why this is on the feed rather than behind a read. A count of
// items that passed a node says nothing about a node holding forty of them —
// the totals look healthy right up until the queue is the whole problem, and the
// number is gone by the time anyone asks.
message PipelineMetersOp {
  string pipeline_id = 1;
  int32 revision = 2;
  repeated PipelineNodeMeterOp nodes = 3;
}

message PipelineNodeMeterOp {
  string node = 1;
  int64 entered = 2;
  // in_flight is the bottleneck signal, and the one figure that cannot be
  // reconstructed afterwards.
  int64 in_flight = 3;
  // failed is items the node could not process — kept apart from an `error`
  // port, because "could not process it" and "sent it down error" are
  // different events with different fixes.
  int64 failed = 4;
  // passed_on counts items that completed and were routed onward without a
  // terminal outcome — the ordinary path through a node. Distinct from `ports`,
  // which only a terminal fate names.
  int64 passed_on = 5;
  // ports counts items by the port they left on.
  map<string, int64> ports = 6;
  int64 mean_latency_ms = 7;
}

// RetentionRunOp reports one bounded retention/compaction pass — what it deleted,
// whether it hit its cap, and whether it failed (ADR-0102 Amendment A1).
//
// A1 reverses ADR-0102 D6, which exposed retention only on the owning plugin's
// own plane. Deletion you can only discover by knowing to go looking for it is
// too close to silent for a product whose argument is auditability.
//
// SOURCE-AGNOSTIC on purpose. The record compactor (REC-03) and the
// reactive-journal GC (GOV-02) are the same shape, so one message serves both and
// the second caller costs no contract bump. It also keeps the OSS contract from
// naming a premium plugin's tables, which ADR-0057 D5 forbids.
message RetentionRunOp {
  // source is the retention domain that ran, e.g. "records". Free-form: an OSS
  // enum here would have to enumerate premium plugins to be useful.
  string source = 1;
  // run_id is the source's own id for the pass, so a feed entry joins to the
  // durable row behind it.
  int64 run_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  // deleted is the per-category count; empty means the pass ran and removed
  // nothing, which is a normal outcome and not missing data.
  repeated RetentionDeletionOp deleted = 5;
  // bounded is true when the pass hit its per-pass cap and more remains. Seen on
  // every tick, it says the backlog is not draining.
  bool bounded = 6;
  // error is empty on success. A FAILED pass is reported, not swallowed:
  // retention that quietly stops working is how a table becomes the outage.
  string error = 7;
}

// RetentionDeletionOp is one category of thing a pass removed. A list rather than
// fixed columns because sources delete different things (record versions and push
// commands; journal entries and dead letters), and fixed fields would force every
// later source to misname its counts or break the contract to add its own.
message RetentionDeletionOp {
  string category = 1; // the source's own word, e.g. "record_versions"
  int32 count = 2;
}

// ScoutUsefulnessOp was the ROUTE-08 phase-A per-session signal: did the always-on
// Scout's pre-plan discovery earn its cost (referenced by the plan? ran without
// replan? what did it cost)? Logging only — training material for a later
// invoke/skip policy.
//
// DEPRECATED 2026-08-08. **Nothing emits this and nothing will.** The Scout organ
// was retired 2026-08-07 (ADR-0100 P3 residuals) and its emitter went with it;
// ROUTE-08 phase B, the invoke/skip gate this was to train, is cancelled rather
// than deferred because there is no organ left to gate.
//
// The message and field number 24 are retained deliberately: the operator contract
// holds at 0093 and a reused field number would make an old client mis-decode a new
// op. A client must not wait for this event, and must not treat its absence as a
// degraded kernel — every build "supports" it in the sense that it can carry it, and
// no build will ever send it. The matching `scout-usefulness` capability string is
// NOT advertised in the handshake, which is the signal to read.
message ScoutUsefulnessOp {
  option deprecated = true;

  string session_id = 1;
  bool scout_ran = 2;
  int64 scout_latency_ms = 3;
  int32 discovery_entities = 4;
  bool discovery_referenced = 5;
  int32 plan_steps = 6;
  int32 replan_count = 7;
  bool replanned = 8;
}

// AgentStepOp reports one in-loop agent action (a memory_query today) so the harness can
// diagnose agent-internal failure modes the orchestration trace hides: query-thrash (count
// + near-duplicate queries per session) and context poisoning (self_hits = retrievals the
// caller itself authored; cross_session_hits = retrievals from a different session).
message AgentStepOp {
  string session_id = 1;
  string agent_id = 2;
  string action = 3; // "memory_query" (extensible)
  string query = 4;
  int32 hits = 5;
  int32 self_hits = 6;
  int32 cross_session_hits = 7;
}

// AgentLLMExchangeOp is one agent reasoning turn captured at the managed LLM
// provider chokepoint (the same tap that feeds Langfuse): the full request prompt and
// completion for a single GenerateViaModelStream call, attributed to the agent and its
// step. Because every SDK ReAct round is one such call — the prompt embeds the running
// trajectory and the completion is one action (memory_query/tool_call/final_answer) —
// the ordered sequence of these per session reconstructs an agent's entire internal
// loop, so a benchmark can review every agent output AND every loop step without any
// SDK change. Live-only/never-replayed (like TokenChunkOp) and gated behind
// execution.capture_llm_exchanges (default off): prompts are large and may be
// sensitive, so this is a benchmark/diagnostic lane, not a production default. request
// and response are truncated to a bounded size by the emitter.
message AgentLLMExchangeOp {
  string session_id = 1;
  string agent_id = 2;
  int32 step_index = 3;
  string purpose = 4;        // "agent_llm" today (extensible: planner, verifier, ...)
  string model_id = 5;
  string request = 6;        // the full prompt sent to the provider (truncated)
  string response = 7;       // the completion returned (truncated)
  int32 request_chars = 8;   // untruncated request length (so truncation is visible)
  int32 response_chars = 9;  // untruncated response length
}

// ResyncRequired tells the client its cursor has fallen out of the retained
// spool window: it must call Snapshot and resubscribe from the snapshot's
// as_of_seq. ADR-0047 D6/D9 (issue 0047-02).
message ResyncRequired {
  uint64 latest_seq = 1; // the feed head at the time resync was signalled
}

message AuctionEventOp {
  string task_id = 1;
  string task_desc = 2;
  string status = 3;
  string winner_id = 4;
  repeated BidEntryOp bids = 5;
  string error_msg = 6;
  // winner_margin is the winning bid's confidence minus the best losing bid
  // (0 when no runner-up). ROUTE-02: a near-zero margin flags a coin-flip.
  float winner_margin = 7;
  // funnel is the Gatekeeper's Declaration->Interview->Merit candidate trace for
  // this auction (ROUTE-02). Absent when routing tracing is disabled or on the
  // 'started' event.
  GatekeeperFunnelOp funnel = 8;
  // ADR-0100 P2 selection cost, reported identically by BOTH selection arms so
  // they are directly comparable.
  // selection_latency_ms is the wall-time spent DECIDING who runs this step
  // (candidate discovery + the bid round on the auction arm); it excludes the
  // winner's execution.
  int32 selection_latency_ms = 9;
  // selection_boots is how many agent processes were cold-started to reach that
  // decision. The auction booted every candidate to ask for a bid; dispatch
  // boots nothing to decide.
  int32 selection_boots = 10;
}

message BidEntryOp {
  string agent_id = 1;
  float confidence = 2;
  string rationale = 3;
  int32 latency_ms = 4;
  // requirements are dependencies the agent declared it needs satisfied before
  // executing (ROUTE-02 auction-proposal record).
  repeated string requirements = 5;
}

// GatekeeperFunnelOp is the per-auction candidate funnel: every agent the
// Gatekeeper considered and the layer that admitted or eliminated it (ROUTE-02).
// It lets a benchmark row reconstruct why a step routed the way it did, from the
// persisted event alone.
message GatekeeperFunnelOp {
  repeated DeclarationResultOp l1 = 1; // Layer 1: Declaration pass-set
  repeated InterviewResultOp l2 = 2;   // Layer 2: Interview (semantic) survivors/eliminated
  double l2_threshold = 3;             // similarity floor applied in Layer 2 (0 if L2 skipped)
  repeated MeritResultOp l3 = 4;       // Layer 3: Merit ranking, highest-first (as presented to the auction)
  int32 max_candidates = 5;            // GatekeeperMaxCandidates cap applied after ranking (0 = uncapped)
}

message DeclarationResultOp {
  string agent_id = 1;
  bool passed = 2;
  string reason = 3; // why it failed (empty when passed)
}

message InterviewResultOp {
  string agent_id = 1;
  double similarity = 2;          // best profile->task similarity; 0 when below threshold (not returned by the searcher)
  bool survived = 3;
  bool provisional_bypass = 4;    // cold-start agent that skipped the semantic gate
}

message MeritResultOp {
  string agent_id = 1;
  double score = 2;
  double success_rate = 3;
  double trust_score = 4;
  double latency_term = 5; // w3 * (1/normLatency) contribution
  double cost_term = 6;    // w4 * normalizedCost contribution (subtracted)
  bool provisional = 7;    // cold-start penalty applied
}

message AgentReadyOp {
  string agent_id = 1;
  string source_hash = 2;
  double trust_score = 3;
  repeated string capabilities = 4;
  int64 interview_ms = 5;

  // ── Contract 0074: the agent detail fields contract 0057 removed ────────
  //
  // Folded onto the projection by agent_id (absolute state, ADR-0047 D6), so an
  // agent detail pane fills from the feed rather than needing a getter back.
  string description = 6;
  string trait = 7;
  string runtime = 8;
  string exec_path = 9;
  string manifest_version = 10;
  // provisional marks an agent whose capability claims have not been verified by
  // an interview yet. It is the difference between "this agent says it can do X"
  // and "we have seen it do X", and routing treats the two differently.
  bool provisional = 11;
  bool system = 12;
  // classification_tags describe what the agent IS, so a policy can permit or
  // deny INVOKING it (ADR-0085 D2). NOT the agent's own read boundary — that
  // lives in the policy plugin, and conflating them is how an operator ends up
  // widening an agent's reach while believing they only labelled it.
  repeated string classification_tags = 13;
  // last_error is the most recent failure this agent reported, empty when none.
  // A healthy-looking agent that fails every dispatch is otherwise indistinguishable
  // from one that is simply idle.
  string last_error = 14;
}

// SessionStateOp is the ABSOLUTE lifecycle state of one session, emitted on every
// transition — open, pause, resume, dormant, complete (Phase 2).
//
// It replaces the per-transition ops as the primary signal. SessionDormantOp and
// SessionCompletedOp still fire alongside it so an older console keeps working, but they
// only ever covered two of the five transitions: a console folding just those could never
// observe a session being CREATED or PAUSED, so newly-opened sessions were invisible until
// the next snapshot and the "paused" state was unreachable paint.
//
// Absolute-state (ADR-0047 D6): a consumer upserts by session_id and needs no history.
message SessionStateOp {
  string session_id = 1;
  string status = 2;      // active | paused | dormant | completed
  string goal = 3;
  string parent_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // reason is the operator-supplied justification when the transition came from a
  // steering command; empty for kernel-driven transitions (idle sweep, consolidation).
  string reason = 7;
}

message SessionDormantOp {
  string session_id = 1;
  int64 ttl_seconds = 2;
}

// DEPRECATED: nothing emits this. It reported the end of a memory-consolidation run, and
// the consolidation pipeline has been removed (it was never wired — the consumer was never
// constructed and the state it waited on was never produced). A session reaching "completed"
// is reported by SessionStateOp, which covers all five transitions.
//
// The message and field number are retained for wire compatibility with consoles pinned to
// an earlier contract; do not reuse field 13.
message SessionCompletedOp {
  option deprecated = true;
  string session_id = 1;
  int32 documents_merged = 2;
}

message MemoryPressureOp {
  int32 total_documents = 1;
  int64 index_size_bytes = 2;
  string trigger = 3;
}

message DaemonCrashedOp {
  string agent_id = 1;
  string stream_id = 2;
}

message WatchTriggeredOp {
  string watch_config_id = 1;
  string stream_id = 2;
  string action_target = 3;
}

message MemoryWrittenOp {
  string doc_id = 1;
  string doc_type = 2;
  string session_id = 3;
  string source = 4;
  string summary = 5;
}

message HITLRaisedOp {
  string intervention_id = 1;
  string session_id = 2;
  string agent_id = 3;
  string description = 4;
  bool is_destructive = 5;
}

message VerifierRoundOp {
  string task_id = 1;
  string winner_agent = 2;
  double quality_score = 3;
  double bid_confidence = 4;
  string critique = 5;
}

message LLMHealthOp {
  string model_id = 1;
  string state = 2;
  string reason = 3;
}

message PlanStateOp {
  string session_id = 1;
  string plan_id = 2;
  int32 active_step = 3;
  string status = 4;
  string active_agent = 5;
  double cost_so_far = 6;
  bool terminal = 7;
  // steps is the plan's DAG for live rendering: one node per step with its dependency
  // edges and current status. Absolute-state (full set re-sent each update); empty on
  // emitters with no plan structure. Backward compatible — older UIs ignore it.
  repeated PlanStepOp steps = 8;
}

// PlanStepOp is one node of a plan's DAG on the operator feed.
message PlanStepOp {
  int32 index = 1;
  string label = 2;              // short human title (the step's query, truncated)
  repeated int32 depends_on = 3; // zero-based indices this step waits on
  bool is_thought = 4;           // reasoning/synthesis step (no external action)
  string status = 5;             // "pending" | "running" | "done" | "failed"
  string agent = 6;              // executor agent id, once dispatched (may be empty)
  // required_capabilities is the ROUTE-03 capability contract for this step — what
  // the planner asked for, straight off domain.Step.RequiredCapabilities.
  //
  // It fills the step-row slot the retiring auction's bids_count vacated. Without
  // it a row can only name the agent, which is the RESULT of routing rather than
  // the REASON for it — and when routing fails, "no agents available" without the
  // requested capability is a dead end for whoever has to fix it.
  //
  // Empty ⇒ the planner emitted no capability contract for this step (the
  // backward-compatible default), NOT "this step needs nothing".
  repeated string required_capabilities = 7;
}

message TokenChunkOp {
  string session_id = 1;
  int32 step_index = 2;
  string text = 3;
}

message AuditOp {
  string id = 1;
  string command_id = 2;
  string actor = 3;
  string role = 4;
  string action_type = 5;
  string target_type = 6;
  string target_id = 7;
  string before = 8;
  string after = 9;
  string reason = 10;
  string result = 11;
}

// ─────────────────────────────────────────────────────────────────────────────
// ADR-0047 Amendment A2 (CORE-OPS-1) messages.
// ─────────────────────────────────────────────────────────────────────────────

// ToolPolicyOp mirrors domain.ToolResourcePolicy (A1.5): the allowed resource
// surface a grant bounds a tool to. Empty lists ⇒ the tool declares no resource
// args of that kind.
message ToolPolicyOp {
  repeated string allowed_paths    = 1;
  repeated string allowed_urls     = 2;
  repeated string allowed_commands = 3;
}

// ToolGrantOp is one agent's grant of a tool, with the policy bounding it — the
// reverse index ListTools builds by scanning per-agent grant sets. A2.3.
message ToolGrantOp {
  string agent_id = 1;
  ToolPolicyOp policy = 2;
}

// ToolOp is a system tool as the operator governs it (the whole catalog, not a
// per-agent menu). source is "builtin" or "mcp:<serverID>", derived from the
// tool name prefix. A2.3.
message ToolOp {
  string name = 1;
  string description = 2;
  bool dangerous = 3;
  string source = 4;                     // "builtin" | "mcp:<serverID>"
  repeated string data_read_kinds = 5;   // ADR-0039 D8 data regime
  repeated string data_write_kinds = 6;
  repeated ToolGrantOp grants = 7;        // which agents hold it, with what policy

  // ADR-0085 D2: what DOMAIN this tool touches (`crm`, `filesystem`, `payments`).
  repeated string classification_tags = 8;
  // ADR-0086: the closed-set verb classes it exercises —
  // read | write | egress | spend | admin. A tag says what a tool is about; an
  // effect says what the invocation does to it, and policy checks both.
  repeated string effects = 9;
  // effects_inferred marks a tool whose effects were DERIVED from its other
  // manifest fields rather than declared. It is the migration checklist: an
  // operator flips execution.tool_effects_strict once this is false everywhere,
  // after which an unclassified tool cannot register at all.
  bool effects_inferred = 10;

  // ── Contract 0074: the detail fields contract 0057 removed ──────────────
  //
  // schema_json is the tool's JSON Schema — the exact menu entry the model sees.
  // It is what makes a tool detail pane answer "why did the agent call this with
  // those arguments?", which nothing else on this plane can. Already carried by
  // domain.SystemTool and simply not projected.
  string schema_json = 11;
  // The resource-arg declarations (ADR-0039 A1.4): which arguments carry a path,
  // a URL or a shell command, and therefore which ones a resource policy binds.
  // Without them a grant's policy reads as applying to the whole tool.
  repeated string path_args = 12;
  repeated string url_args = 13;
  repeated string command_args = 14;
}

message ListToolsOpRequest {
  int32 page = 1;
  int32 page_size = 2;
  string query = 3;         // substring filter over name/description
  bool dangerous_only = 4;
  string source = 5;        // "" = all; "builtin"; "mcp:<serverID>" prefix match
}
message ListToolsOpResponse {
  repeated ToolOp tools = 1;
  int32 total = 2;
  int32 page = 3;
}

message ListSkillsOpRequest {
  int32 page = 1;
  int32 page_size = 2;
  string query = 3;
}
message SkillOp {
  string name = 1;
  string description = 2;
  repeated string tool_grants = 3;
  repeated string scope_tags = 4;

  // ── Contract 0074 ───────────────────────────────────────────────────────
  //
  // body is the skill's instruction text (SKILL.md). A skill IS its instructions
  // — that is the whole artefact — so a detail pane without it can only list the
  // skill's name and grants and never show what it actually tells an agent to do.
  string body = 5;
  // source_path is where it was loaded from, which is what an operator needs to
  // edit it. Empty for a skill registered over the wire rather than from disk.
  string source_path = 6;
}
message ListSkillsOpResponse {
  repeated SkillOp skills = 1;
  int32 total = 2;
  int32 page = 3;
}

// Reconciled with the CLI's existing memory types (A2.4): query/top_k mirror the
// agent-plane MemoryRequest; source/session/min_importance are operator filters.
message QueryMemoryRequest {
  string query = 1;
  int32 top_k = 2;
  string source = 3;
  string session = 4;
  double min_importance = 5;
}
message MemoryOp {
  string doc_id = 1;
  string summary = 2;
  double score = 3;
  string source = 4;
  double importance = 5;
  repeated string tags = 6;
  // ADR-0060 structural location of the hit ("Ops Review > 3.2 Incidents"), stamped
  // on the chunk at ingest. Empty for flat documents. Citation UIs render this as the
  // source breadcrumb — without it a source card can only show an opaque doc_id.
  string section_path = 7;
  // The retrieved chunk body verbatim. `summary` is a <=200-char first-line preview
  // and is NOT quotable; a grounded citation needs the passage the answer came from.
  string text = 8;
}
message QueryMemoryResponse {
  repeated MemoryOp results = 1;
  // policy_note explains a result set that is empty or narrowed BECAUSE of access
  // policy, rather than because the corpus has nothing to say (ADR-0085 INV-3). It
  // is empty when policy played no part. Without this, a fail-closed model's most
  // common failure — zero rows and no error — is indistinguishable from "no data".
  AccessDecisionOp policy_note = 2;
}

// AnswerMemory (ADR-0081): grounded, span-cited answer.
message AnswerMemoryRequest {
  string query = 1;
  int32 top_k = 2;          // evidence-pool cap (0 = kernel default)
  string source = 3;        // optional filter on the evidence pool
  string session = 4;       // optional filter
  double min_importance = 5;// optional filter
}
// MemoryCitation is one piece of evidence the answer's [n] markers point to.
message MemoryCitation {
  int32 marker = 1;         // the [n] used inline in `answer`
  string doc_id = 2;
  string text = 3;          // the verbatim chunk — what a citation quotes
  string section_path = 4;  // ADR-0060 breadcrumb; empty for flat docs
  string source = 5;
  double score = 6;
  double importance = 7;
  repeated string tags = 8;
}
message AnswerMemoryResponse {
  // answer | abstention | clarification. Abstention means the evidence does not
  // answer the question — a UI must render it as such, never as an empty answer.
  string status = 1;
  // Grounded prose with inline 1-based [n] markers resolving to `citations`.
  string answer = 2;
  repeated MemoryCitation citations = 3;
  // policy_note explains an abstention that access policy CAUSED, rather than one
  // the corpus caused (ADR-0085 INV-3). Empty when policy played no part.
  //
  // This is the surface where the distinction actually bites: "the corpus does
  // not answer that" and "you are not permitted to see the answer" are very
  // different statements, and a fail-closed model renders them identically
  // unless the reason travels with the abstention.
  AccessDecisionOp policy_note = 4;
}

// SetToolPolicy binds an existing grant with a resource policy (A2.3). Setting a
// policy on an agent that lacks the grant is an InvalidArgument (grant first).
message SetToolPolicyRequest {
  string command_id = 1;
  string reason = 2;
  string agent_id = 3;
  string tool_name = 4;
  ToolPolicyOp policy = 5;
}

// ExecuteTool runs a tool at ScopeSystem (A2.2). deduped=true returns the
// original result_json without re-running (result captured in the audit row).
message ExecuteToolOpRequest {
  string command_id = 1;
  string reason = 2;
  string tool_name = 3;
  string args_json = 4;
  string session_id = 5;
}
message ExecuteToolOpResponse {
  string command_id = 1;
  bool deduped = 2;
  string result_json = 3;
  bool denied = 4;
  string deny_reason = 5;
  string error = 6;
}

// IngestMemory requests a kernel document ingest (A2.4) — never a raw store
// write. tags are a narrow-only hint (kernel derives classification); the
// operator principal is stamped as Author. Idempotent on command_id.
message IngestMemoryOpRequest {
  string command_id = 1;
  string reason = 2;
  // Text body. Exactly one of `text` or `content` must be set.
  string text = 3;
  repeated string tags = 4;
  double importance = 5;
  string source = 6;
  string session_id = 7;
  // ADR-0060 binary upload lane: raw file bytes handed to the docling_agent
  // (RT-DETR/TableFormer) for structure-aware parsing. Exactly one of `text` or
  // `content` must be set. Prefer `text` for markdown/plain — it skips the sidecar.
  bytes content = 8;
  // Original filename, e.g. "2026-W29-ops-review.pdf". Drives chunker routing: the
  // extension resolves the chunker via chunker_registry(source_type, ext). Required
  // when `content` is set — bytes with no extension cannot be routed.
  string filename = 9;
  // Optional MIME hint. Advisory only; the extension wins for routing.
  string content_type = 10;
  // Operator-supplied context for this document ("Q3 board pack, figures are
  // provisional"). Prepended to the body as a titled section so it is chunked,
  // embedded, and retrievable/citable like any other content — a metadata-only
  // field would never reach the index and so could never affect an answer.
  string context = 11;
}
message IngestMemoryOpResponse {
  string command_id = 1;
  bool deduped = 2;
  string doc_id = 3;
}

// ApprovalOp mirrors the ADR-0039 dangerous-tool ApprovalRequest (A2.5): the
// shipping ApprovalsPane renders tool_name/agent_id/args_preview.
message ApprovalOp {
  string id = 1;
  string agent_id = 2;
  string tool_name = 3;
  string args_preview = 4;
  bool is_destructive = 5;
}

// ── Watch CRUD (premium capability-gated; proto in OSS). A2.6. ────────────────
// WatchConfigOp/WatchActionOp are the operator-plane watch shapes. Field names
// mirror the agent-plane WatchConfigProto/WatchActionProto so a CLI reuses its
// hand-written types, but they are DISTINCT messages (D1/A2.1): the operator
// plane never shares a contract with the agent plane.
message WatchActionOp {
  string type = 1;        // "dispatch_agent" | "emit_event" | "start_plan" | "ingest"
  string target_type = 2; // "agent_id" | "capability" — required for dispatch_agent
  string target = 3;
  string payload = 4;
}
message WatchConfigOp {
  string id = 1;
  string name = 2;
  string description = 3;
  string source_type = 4;
  string source_stream_id = 5;
  string condition = 6;
  string condition_type = 7;
  // action is the FIRST arm. Kept singular so a watch stored before contract
  // 0076 still round-trips unchanged.
  WatchActionOp action = 8;
  bool active = 9;
  string response_mode = 10;
  map<string, string> daemon_params = 11;
  int32 max_concurrent_plans = 12;
  int32 debounce_seconds = 13; // REACT-02 / ADR-0062: coalesce at most once per T seconds (0 = off)
  repeated string condition_payload_keys = 14; // REACT-03 / ADR-0063: llm-condition payload-key allowlist
  bool approved = 15;                           // REACT-03 / ADR-0063: operator ack for a high-risk llm-condition watch
  bool dry_run = 16;                            // REACT-05 / ADR-0071: evaluate + record, never act
  string source_cron = 17;                      // REACT-06 / ADR-0072: 5-field cron (or @shortcut) for a "schedule" source
  string source_timezone = 18;                  // REACT-06 / ADR-0072: IANA tz the cron is evaluated in (empty = UTC)
  string missed_fire_policy = 19;               // REACT-06 / ADR-0072: "fire_once" | "skip" (default) across restart

  // ── Contract 0074: stream liveness ──────────────────────────────────────
  //
  // A watch is only as alive as the stream under it. When the daemon feeding
  // source_stream_id crashes, the stream goes unavailable and EVERY watch on it
  // silently stops evaluating — no error, no dead letter, no fired event. The
  // watch still reads "active", which is the most misleading state in the
  // reactive plane: an operator sees a healthy row for a rule that has not run
  // in days.
  //
  // source_stream_state is "live" | "unavailable" | "unknown". "unknown" is NOT
  // "unavailable": a kernel with no stream registry cannot tell, and reporting a
  // guess as a fact here would raise false alarms on every watch.
  string source_stream_state = 20;
  // source_stream_refcount is how many watches hold this stream. It answers the
  // question that follows the first: fixing a dead daemon un-breaks N rules, not
  // just the one being looked at. -1 ⇒ not counted.
  int32 source_stream_refcount = 21;

  // last_fires is the recent fire history, newest last, for the sparkline the
  // design asks for. Bounded server-side; empty ⇒ never fired OR not recorded by
  // this kernel — see WatchFireOp.
  repeated WatchFireOp last_fires = 22;

  // actions are arms 2..N (contract 0076). A multi-armed pipeline — "notify the
  // channel AND open a ticket" — could not be stored while `action` was the only
  // field, so a builder had to draw arms the engine silently dropped. A builder
  // that draws what the engine collapses is worse than one that says "not yet".
  //
  // Arms run IN ORDER and independently: one failing arm does not cancel the
  // others, because a notification that succeeded has already been seen and
  // pretending otherwise would misreport what happened.
  repeated WatchActionOp actions = 23;
}

// WatchFireOp is one recorded evaluation of a watch.
message WatchFireOp {
  int64 at_unix_ms = 1;
  // outcome is "fired" | "suppressed" | "failed" | "would_fire" (dry run).
  // "suppressed" is a rule WORKING — the condition was evaluated and said no —
  // and a console that renders it as a failure trains an operator to loosen a
  // boundary that is doing its job.
  string outcome = 2;
  // error is set only when outcome == "failed".
  string error = 3;
  int64 latency_ms = 4;
}
message ListWatchesOpRequest {
  int32 page = 1;
  int32 page_size = 2;
  bool active_only = 3;
}
message ListWatchesOpResponse {
  repeated WatchConfigOp configs = 1;
  int32 total = 2;
  int32 page = 3;
}
message RegisterWatchOpRequest {
  string command_id = 1;
  string reason = 2;
  WatchConfigOp config = 3;
}
message DeleteWatchOpRequest {
  string command_id = 1;
  string reason = 2;
  string watch_id = 3;
}
message SetWatchActiveOpRequest {
  string command_id = 1;
  string reason = 2;
  string watch_id = 3;
  bool active = 4;
}

// REACT-01 / ADR-0061: reactive dead-letter read surface.
message ListWatchDeadLettersOpRequest {
  int32 limit = 1; // 0 ⇒ all
}
message ListWatchDeadLettersOpResponse {
  repeated WatchDeadLetterOp entries = 1;
}
message WatchDeadLetterOp {
  string id = 1;
  string watch_id = 2;
  string action_type = 3;
  string key = 4;           // idempotency key (empty for queue-full/expired drops)
  string reason = 5;        // failure reason: action error text, "queue_full", "expired_before_replay"
  string signal_stream_id = 6;
  string signal_raw_text = 7;
  int64 failed_at_unix_ms = 8;
}

// REACT-05 / ADR-0071: watch observability.
message GetWatchMetricsOpRequest {}
message GetWatchMetricsOpResponse {
  repeated WatchMetricsOp metrics = 1;
}
message WatchMetricsOp {
  string watch_id = 1;
  int64 signals_seen = 2;
  int64 condition_fired = 3;
  int64 condition_suppressed = 4;
  int64 dry_run_would_fire = 5;
  int64 action_failed = 6;
  int64 dead_lettered = 7;
  double mean_condition_latency_ms = 8;
}
message BacktestWatchOpRequest {
  WatchConfigOp config = 1; // candidate watch to replay over the journal
  uint64 after_seq = 2;     // replay journaled signals with seq > after_seq (0 = all)
}
message BacktestWatchOpResponse {
  repeated WatchBacktestVerdictOp verdicts = 1;
  // The journal window these verdicts were computed over (GOV-02).
  //
  // A backtest answers "would this watch have fired over history?", and journal GC
  // shortens the history it can reach. Without the window a caller cannot tell
  // "fired twice in six months" from "fired twice in the four days still retained"
  // — the same sentence, two very different answers. Reported alongside the
  // verdicts rather than left to be assumed.
  //
  // retained_count 0 means the journal is empty, not that the window is unknown.
  uint64 retained_oldest_seq = 2;
  uint64 retained_newest_seq = 3;
  int32 retained_count = 4;
}
message WatchBacktestVerdictOp {
  uint64 seq = 1;
  string stream_id = 2;
  string raw_text = 3;
  bool would_fire = 4;
  string eval_error = 5;
}

// ROUTE-07 / ADR-0077: PreviewRoute request — a step's required capabilities plus the
// inline candidate profiles to score. The caller supplies synthetic profiles so the
// preview is deterministic and needs no live fleet.
message PreviewRouteOpRequest {
  string task_desc = 1;                       // informational (logging); scoring is profile-driven
  repeated string required_capabilities = 2;  // the step's required caps (ROUTE-06 tag scoping)
  repeated PreviewCandidateOp candidates = 3;
}
message PreviewCandidateOp {
  string agent_id = 1;
  string trait = 2; // "cognitive" | "model" | ... (model omits the latency term, ADR-0018)
  double success_rate = 3;
  double trust_score = 4;
  int32 network_latency_ms = 5;
  int32 computation_latency_ms = 6;
  int32 context_growth_bytes = 7;
  bool provisional = 8;
  double avg_cost_per_task = 9; // TraitModel cost normalization
  map<string, PreviewCapStatOp> capability_stats = 10; // per-capability success/trust (ROUTE-06)
}
message PreviewCapStatOp {
  double success_rate = 1;
  double trust_score = 2;
  int32 sample_count = 3;
}
message PreviewRouteOpResponse {
  repeated MeritResultOp ranked = 1; // merit breakdowns, highest score first
  string arm = 2;                    // "hand_weights" | "learned_scorer" (the active scorer)
}

// REACT-02 / ADR-0062: backpressure shed event on the feed.
message ReactiveBudgetOp {
  string resource = 1;             // "llm_condition" | "start_plan" | "stream_rate"
  string reason = 2;               // dead-letter reason applied to shed units
  string stream_id = 3;            // affected stream ("" for plane-wide budgets)
  int64 shedding_since_unix_ms = 4;
}


// ─── ADR-0085 access policy ────────────────────────────────────────────────────

// ExplainAccessOpRequest asks a hypothetical question. Nothing is read, written,
// or journalled as a real access.
message ExplainAccessOpRequest {
  string principal_id = 1;   // the principal being asked about
  string principal_kind = 2; // "agent" | "user" | "daemon" (default "agent")
  string surface_kind = 3;   // "operator" | "agent" | "chat" | "reactive" ("" = none)
  string surface_id = 4;     // the specific surface instance ("" = any)
  string resource_kind = 5;  // "memory" | "skill" | "agent" | "tool" | "artifact"
  string resource_id = 6;    // the specific resource ("" = a class-level question)
  repeated string tags = 7;  // the resource's classification tags
  repeated string effects = 8; // declared effect classes (tools): read|write|egress|spend|admin
}

// PolicyContributionOp records that a named policy, linked at a named container,
// contributed a specific term. This is what turns a denial from "no" into
// "because policy P, linked at L, contributed tag T".
message PolicyContributionOp {
  string policy_id = 1;
  string policy_name = 2;
  string linked_at = 3;   // "organisation" | "group:<id>" | "principal:<id>" | "surface:<id>"
  string term = 4;        // "required" | "any_of" | "forbidden" | "effect"
  repeated string values = 5;
  bool enforced = 6;      // the link's Enforced flag (a downstream block does not apply)
}

// AccessDecisionOp is one structured, explainable decision.
message AccessDecisionOp {
  bool allowed = 1;
  string reason = 2;   // DecisionReason: allowed|bypass|forbidden_tag|missing_required_tag|
                       // anyof_unsatisfied|effect_not_permitted|unsatisfiable_policy|
                       // no_principal|skill_grant_clipped|not_authorized
  string detail = 3;   // the SPECIFIC tag, clause, or effect responsible
  repeated PolicyContributionOp decided_by = 4;
  string policy_version = 5; // the snapshot this was computed against (reproducibility)
  bool report_only = 6;      // evaluated but not enforced (ADR-0085 D9)
  bool would_have_denied = 7;// what enforcement would have done, under report-only
  string explain = 8;        // one administrator-readable sentence
}

message ExplainAccessOpResponse {
  AccessDecisionOp decision = 1;
}

message ListClassificationTagsOpRequest {}

message ListClassificationTagsOpResponse {
  repeated string tags = 1;
}

message ListDocumentsOpRequest {
  int32  limit  = 1;  // page size; the server clamps it
  string cursor = 2;  // keyset: the last id of the previous page, exclusive
  // The question that motivated the RPC. An unlabelled document is unreachable by
  // any rule, so this is the operator's actual worklist rather than a convenience
  // filter.
  bool   unlabelled_only = 3;
  string id_prefix = 4;  // cheap prefix filter; full-text search is QueryMemory's job
}

// DocumentSummaryOp is a LISTING row, not a document: no body, no chunks. Enough to
// decide what to label and nothing more, so paging a large corpus stays cheap.
message DocumentSummaryOp {
  string id = 1;
  string title = 2;
  string source_type = 3;
  repeated string tags = 4;
  int32  chunk_count = 5;
  int64  created_at_unix_ms = 6;
}

message ListDocumentsOpResponse {
  repeated DocumentSummaryOp documents = 1;
  // Empty when the last page has been served. Opaque to the client.
  string next_cursor = 2;
  // Total documents matching the filter, ignoring paging — so the console can say
  // "422 of 1163 unlabelled" rather than "50 shown", which is the number that tells
  // an operator how much of the corpus no rule can reach.
  int32 total_matching = 3;
}

// ── Contract 0072 messages ───────────────────────────────────────────────────

message ListSessionCheckpointsOpRequest {
  string session_id = 1;
  // after_seq pages forward; 0 ⇒ from the beginning.
  int64 after_seq = 2;
}

// SessionCheckpointOp is one persisted mid-plan recovery point.
message SessionCheckpointOp {
  string session_id = 1;
  // run_id is load-bearing, not decoration. Checkpoints are keyed by RUN, and a
  // session accumulates many runs, so step_index is only meaningful relative to
  // this run's plan. Two rows can share step_index 2 and mean different points.
  string run_id = 2;
  string plan_id = 3;
  int32  step_index = 4;
  int64  written_at_unix_ms = 5;
  // reason is why this point was checkpointed (an explicit checkpoint_after, a
  // pre-replan snapshot, and so on). Empty when the writer recorded none.
  string reason = 6;
  // resumable reports whether a resume FROM HERE is still valid — the plan it was
  // taken against still matches, and the stored context still satisfies it.
  //
  // It matters more than it looks: a checkpoint the kernel would refuse to resume
  // from is worse than no checkpoint at all, because the operator plans a recovery
  // that will not happen.
  bool resumable = 7;
}

message ListSessionCheckpointsOpResponse {
  repeated SessionCheckpointOp checkpoints = 1;
}

message ListMCPServersOpRequest {}

// MCPServerOp is one configured external MCP server (ADR-0043).
message MCPServerOp {
  string name = 1;
  // transport is "stdio" or "http", mirroring MCPServerConfig.
  string transport = 2;
  // command / url describe how it is reached. Never any auth material: MCP auth
  // is referenced by env-var NAME in config and resolved at call time.
  string command = 3;
  string url = 4;
  // connected reports live reachability at the time of the call.
  bool connected = 5;
  // last_error is the most recent connection or call failure, empty when none.
  string last_error = 6;
  // tool_count is how many tools this server currently advertises.
  int32 tool_count = 7;

  // The DECLARED half (contract 0097), so a console edit round-trips instead of
  // being reconstructed from the display split above: `command`/`url` are
  // renderings, `endpoint`+`args` are what the config actually holds.
  string endpoint = 8;
  repeated string args = 9;
  // auth_type is "none" | "bearer" | "header"; auth_header only when "header".
  string auth_type = 10;
  string auth_header = 11;
  // token_configured / token_source are the ONLY credential facts on the wire,
  // exactly like a generator's key: the token itself has one path onto this
  // plane (SetMCPServerToken) and no path back off it.
  bool   token_configured = 12;
  string token_source = 13;
  // classification_tags apply to every tool this server advertises (ADR-0085
  // D2) — without them, dynamically discovered tools arrive untaggable.
  repeated string classification_tags = 14;
}

message ListMCPServersOpResponse {
  repeated MCPServerOp servers = 1;
  // configured distinguishes "this deployment has no MCP servers" (true, empty
  // list) from "MCP is not set up at all" (false). Without it a console cannot
  // tell an intentional zero from an absent subsystem, and renders the same
  // screen for both.
  bool configured = 2;
}

message GetEmbeddingConfigOpRequest {}

message EmbeddingConfigOp {
  string provider = 1;
  string model = 2;
  int32  dimensions = 3;
  // vector_count is the number of stored embeddings. -1 ⇒ the kernel could not
  // count them (no vector store wired), which is NOT the same as zero.
  int64  vector_count = 4;
  string endpoint = 5;
}

message ClassifyInputOpRequest {
  string text = 1;
  // surface optionally names where the text arrived from, which the router may
  // use as a pre-classification hint (Layer 0). Empty ⇒ classify from the text.
  string surface = 2;
}

message ClassifiedInputOp {
  // classification is one of: "chat", "plan", "ingest", "watch", "clarification".
  //
  // A client MUST NOT collapse this into a smaller set. "plan" spends tokens and
  // touches files; "ingest" WRITES to memory and the written content inherits the
  // ingress's labels. Rendering either as the other misrepresents the consequence
  // the operator is being asked to approve. An unrecognised value means the kernel
  // is newer than the client: show it verbatim and do not act.
  string classification = 1;
  // why names the layer that decided and its reason ("layer 2 heuristic: imperative
  // verb with a file object"). An unexplained label is not something an operator
  // can sensibly overrule, and overruling is the entire point of showing it.
  string why = 2;
  // confidence is the classifier's own confidence in [0,1]. 0 ⇒ not reported by
  // the deciding layer (the deterministic layers do not compute one).
  double confidence = 3;
  // clarification_question / clarification_options are populated only when
  // classification == "clarification": the router already knows the input is too
  // ambiguous to route and has the question ready.
  string clarification_question = 4;
  repeated string clarification_options = 5;
}

message ListGeneratorsOpRequest {}

// GeneratorOp is one configured LLM generator plus its live pulse.
message GeneratorOp {
  string id = 1;
  string provider = 2;
  string model = 3;
  string endpoint = 4;
  // key_configured / key_last_four are the ONLY credential facts on the wire.
  // There is no field carrying the key and no RPC that returns one (see
  // ListGenerators). key_source is "env:<VAR>" or "store", so an operator can see
  // WHERE the active credential comes from without seeing the credential.
  bool   key_configured = 5;
  string key_last_four = 6;
  string key_source = 7;
  // breaker_state is "closed" (healthy), "open" (shedding) or "half_open".
  string breaker_state = 8;
  int32  recent_failures = 9;
  int64  timeout_ms = 10;
  // Token accounting only — no price, currency or rate fields anywhere on this
  // plane. A completion response carries token counts and never money, so any
  // figure in a currency would be one the kernel invented from an unreconciled
  // rate. Configured rates live in config and are published as a catalogue, not
  // multiplied into a spend figure here.
  //
  // -1 means NOT TRACKED by this kernel, and is distinct from 0. "0 calls today"
  // is a claim about traffic; reporting it for a counter that does not exist
  // would make a busy generator look idle, which is the direction that misleads.
  int64 tokens_in_today = 11;
  int64 tokens_out_today = 12;
  int64 calls_today = 13;
  // is_default marks the generator serving as the global default (ADR-0042).
  bool is_default = 14;
  // The DECLARED half of a generator — what an operator edits, as opposed to the
  // measured pulse above. Reported so an edit round-trips: a console that cannot
  // read these back has to invent them on save, and writing an invented false
  // over a true native_tools declaration silently disables tool-calling.
  repeated string capabilities = 15;
  // native_tools is DECLARED, never probed (ADR-0097 D2). An OpenAI-COMPATIBLE
  // endpoint is not necessarily tool-capable, and a wrong declaration fails
  // loudly on first use rather than intermittently mid-session.
  bool native_tools = 16;
  bool disable_thinking = 17;
}

message ListGeneratorsOpResponse {
  repeated GeneratorOp generators = 1;
}

message ListRoleAssignmentsOpRequest {}

// RoleAssignmentOp binds a system organ to the generator that serves it.
message RoleAssignmentOp {
  // role is one of: "planner", "verifier", "router", "interview", "memory".
  // Note "interview" is the AGENT examiner (ROUTE-03), not an operator-facing
  // clarification interview — they are different subsystems with one word.
  string role = 1;
  string generator_id = 2;
  // resolved reports whether generator_id names a generator that actually exists.
  // A role pointing at a removed generator silently falls back to the default,
  // which is invisible everywhere else.
  bool resolved = 3;
}

message ListRoleAssignmentsOpResponse {
  repeated RoleAssignmentOp assignments = 1;
}

message TestGeneratorOpRequest {
  string generator_id = 1;
}

message GeneratorTestResultOp {
  bool   ok = 1;
  // model_served is the model string the ENDPOINT echoed back, which is the whole
  // reason this RPC exists. An endpoint that answers happily with a different
  // build than the one requested is the most common misconfiguration here, and it
  // is invisible in every other surface — including a successful generation.
  string model_served = 2;
  int64  latency_ms = 3;
  string error = 4;
  // sample is a short fragment of the completion, so a human can see it answered
  // rather than echoed. Never the full response.
  string sample = 5;
  // model_requested is the model this generator is CONFIGURED with — what the
  // probe asked for. Carried because the comparison that matters needs both
  // sides, and a client that only receives one has to guess at the other.
  string model_requested = 6;
  // model_matches is the verdict, decided HERE.
  //
  // The console previously compared model_served against the generator ID, which
  // is a different string entirely, so a correctly-served model reported a
  // mismatch while displaying two identical values. The kernel holds both facts;
  // it should not be exporting half of a comparison.
  bool model_matches = 7;
  // native_tools_checked reports whether tool-calling was exercised at all.
  //
  // FALSE means not tested — which is not the same as failed, and must never be
  // rendered as one. The probe does a plain completion today.
  bool native_tools_checked = 8;
  bool native_tools_ok = 9;
}

// GeneratorSpecOp is the DECLARED half of a generator — the fields an operator
// authors. Deliberately no breaker state, no counters and no credential: those
// are measured or write-only, and accepting them here would invite a console to
// send back a stale reading as if it were intent.
message GeneratorSpecOp {
  // id is permanent — role assignments refer to it. Saving under a new id
  // CREATES a generator; the old one keeps serving whatever pointed at it.
  string id = 1;
  // provider is the wire protocol ("openai", "ollama", …), not the vendor.
  string provider = 2;
  string model = 3;
  string endpoint = 4;
  int64  timeout_ms = 5;
  // capabilities is the work this generator will be OFFERED. A tag it lacks is
  // work it never sees, so an empty list is a meaningful, and quiet, choice.
  repeated string capabilities = 6;
  bool native_tools = 7;
  bool disable_thinking = 8;
  // api_key_env names an environment variable holding the credential, for
  // deployments that inject one. It is a VARIABLE NAME, never a key — the key
  // itself has exactly one path onto this plane, SetGeneratorKey, and no path
  // back off it.
  string api_key_env = 9;
}

message SaveGeneratorOpRequest {
  GeneratorSpecOp generator = 1;
  string command_id = 2;
  string reason = 3;
}

message RemoveGeneratorOpRequest {
  string generator_id = 1;
  string command_id = 2;
  string reason = 3;
}

message SetRoleAssignmentOpRequest {
  string command_id = 1;
  string reason = 2;
  // role is one of: "planner", "verifier", "router", "interview", "memory" —
  // the same vocabulary RoleAssignmentOp.role reports. An unknown role is
  // rejected: the map is open in config, but a misspelled role stored durably
  // would sit in the store forever doing nothing.
  string role = 3;
  string generator_id = 4;
}

// MCPServerSpecOp is the DECLARED half of an MCP server — what an operator
// authors (contract 0097). No connection state, no tool count, no credential:
// those are measured or write-only, and accepting them back on a write would
// let a console send a stale reading as if it were intent.
message MCPServerSpecOp {
  // id is permanent — tool names are namespaced mcp:<id>/<tool>, so grants and
  // skills refer to it.
  string id = 1;
  // transport is "stdio" | "http" (Streamable HTTP) | "sse" (legacy HTTP+SSE).
  string transport = 2;
  // endpoint is a URL for http/sse and a command for stdio.
  string endpoint = 3;
  repeated string args = 4;
  // auth_type is "none" | "bearer" | "header"; auth_header names the header
  // when type is "header". The token itself never travels here — it has
  // exactly one path onto this plane, SetMCPServerToken.
  string auth_type = 5;
  string auth_header = 6;
  // classification_tags apply to every tool this server advertises (ADR-0085
  // D2). Without a server-level default, dynamically discovered tools arrive
  // untagged — and an untagged tool is one no tag predicate can restrict.
  repeated string classification_tags = 7;
}

message SaveMCPServerOpRequest {
  MCPServerSpecOp server = 1;
  string command_id = 2;
  string reason = 3;
}

message RemoveMCPServerOpRequest {
  string server_id = 1;
  string command_id = 2;
  string reason = 3;
}

message SetMCPServerTokenOpRequest {
  string command_id = 1;
  string reason = 2;
  string server_id = 3;
  // token is write-only. It is never returned by any RPC, never written to the
  // audit log, and never logged.
  string token = 4;
}

message ClearMCPServerTokenOpRequest {
  string command_id = 1;
  string reason = 2;
  string server_id = 3;
}

message TestMCPServerOpRequest {
  // The spec under test — possibly unsaved. A stored token for server.id is
  // used when the spec declares auth, so a token can be verified without ever
  // travelling back to the console.
  MCPServerSpecOp server = 1;
}

message MCPServerTestResultOp {
  bool  ok = 1;
  int64 latency_ms = 2;
  // tool_names is what the server ACTUALLY advertises — the fact worth one
  // real connection. Empty with ok=true means the server answered and offers
  // nothing, which is a different finding from a refused connection.
  repeated string tool_names = 3;
  string error = 4;
}

message RetryWatchDeadLetterOpRequest {
  string command_id = 1;
  string reason = 2;
  // dead_letter_id identifies the entry to replay. The replay reuses the
  // idempotency key recorded with it (REACT-01), so a double-click is a no-op
  // rather than a second fire.
  string dead_letter_id = 3;
}

message GetConfigSchemaOpRequest {}

message ConfigSchemaOp {
  string schema_version = 1;
  // schema_json is JSON Schema Draft 2020-12 over the editable tunables.
  string schema_json = 2;
  string schema_hash = 3;

  // editable_keys may be written through SetRuntimeConfig. kernel_only_keys are
  // reported so a form can render them READ-ONLY rather than omit them — a field
  // an operator cannot find is indistinguishable from one that does not exist.
  repeated string editable_keys = 4;
  repeated string kernel_only_keys = 5;

  // current_values is a flat map<string,double>, mirroring
  // SetRuntimeConfigRequest.params exactly, so read and write agree on shape and
  // booleans travel as 1/0 in both directions.
  //
  // Deliberately scoped to the NUMERIC tuning surface. The kernel holds
  // non-numeric config too (generators, MCP servers, the embedder), but those
  // have typed accessors of their own; widening this into a value union would
  // produce one RPC that is awkward for both jobs.
  map<string, double> current_values = 6;

  // value_source maps a key to the layer supplying it: "default", "tuning.json",
  // "tuning.local.json", "config.json", "store", "env:CAMBRIAN_…".
  //
  // An "env:" source means a store write will be SHADOWED. The kernel also warns
  // at write time rather than leaving this read to be the only signal, because an
  // operator who sees "saved" learns the truth otherwise only if they look.
  map<string, string> value_source = 7;
}

message SetConfigOpRequest {
  string command_id = 1;
  string reason = 2;
  // values maps flat config keys ("execution.ewma_alpha") to their new value.
  // Numeric only, mirroring SetRuntimeConfigRequest.params, so booleans travel
  // as 1/0 in both directions and the read and write halves agree on shape.
  map<string, double> values = 3;
}

message DeleteConfigOpRequest {
  string command_id = 1;
  string reason = 2;
  repeated string keys = 3;
}

message SetGeneratorKeyOpRequest {
  string command_id = 1;
  string reason = 2;
  string generator_id = 3;
  // key is write-only. It is never returned by any RPC, never written to the
  // audit log, and never logged.
  string key = 4;
}

message ClearGeneratorKeyOpRequest {
  string command_id = 1;
  string reason = 2;
  string generator_id = 3;
}

// ConfigWriteOutcomeOp is what happened to ONE key.
message ConfigWriteOutcomeOp {
  string key = 1;
  // stored reports whether the value reached the durable store. A shadowed key
  // is still STORED — it is the operator's stated intent, and it takes effect
  // the moment the shadowing variable is removed.
  bool stored = 2;

  // effect is one of:
  //   "live"             — applied to the running kernel AND stored
  //   "restart_required" — stored; the kernel reads this key only at boot
  //   "shadowed"         — stored, but a higher layer supplies the live value,
  //                        so nothing changes until that layer is removed
  //   "rejected"         — not stored; see error
  //
  // "shadowed" is the reason this response exists. It closes the worst
  // configuration bug there is — you change a value, it saves, and nothing
  // happens — by saying so AT WRITE TIME rather than leaving the operator to
  // infer it from a later read they may never perform.
  string effect = 3;

  // shadowed_by names the layer winning over the store, e.g.
  // "env:CAMBRIAN_EXECUTION__EWMA_ALPHA". Set only when effect == "shadowed",
  // and it must name the specific variable: "something is pinning this" leaves
  // an operator hunting, the variable name does not.
  string shadowed_by = 4;

  // error explains a rejection: an unknown key, or a value outside the range the
  // schema declares. An unknown key is reported and SKIPPED rather than failing
  // the whole request, so a console built against a newer or older kernel cannot
  // lose the writes that were valid.
  string error = 5;
}

message SetConfigOpResponse {
  string command_id = 1;
  bool deduped = 2;
  repeated ConfigWriteOutcomeOp outcomes = 3;
}

// AuthoredStepOp is one step of an operator-authored plan. Field-for-field
// domain.Step — the DAG builder is a face for the plan schema, not a new one.
message AuthoredStepOp {
  string query = 1;
  repeated string required_capabilities = 2;
  // depends_on holds ZERO-BASED indices into the submitted step list.
  repeated int32 depends_on = 3;
  double max_energy = 4;
  // DEPRECATED 2026-08-07 and no longer read. Model choice is the LLM Provider's,
  // resolved from the declared need (ADR-0042 D1); a per-step model name on an
  // authored plan overrode that decision. Field number retained, never reused.
  string recommended_model = 5 [deprecated = true];
  bool   checkpoint_after = 6;
  string checkpoint_query = 7;
  bool   is_thought = 8;

  // preferred_agent is the SOFT pin: this agent goes first, but ranking still
  // runs behind it and the step cascades normally if it is unavailable.
  string preferred_agent = 9;
  // agent_pin is the STRENGTH of preferred_agent — "soft" or "hard". A hard pin
  // kills the step rather than cascading. Empty with a non-empty preferred_agent
  // reads as SOFT, so a malformed pin degrades to the weaker, non-stranding
  // behaviour rather than stranding a step on a typo.
  string agent_pin = 10;

  // fan_out_over names the index of a prior step whose output supplies a SET;
  // at runtime this one step expands into N children. -1 ⇒ an ordinary step.
  int32  fan_out_over = 11;
  // fan_out_var is the template variable substituted per item in `query`.
  // Empty ⇒ "item". Supplying fan_out_over without this silently templates on
  // "item", which is why the field is explicit here rather than implied.
  string fan_out_var = 12;
}

message SubmitPlanOpRequest {
  string command_id = 1;
  string reason = 2;
  // session_id to attach to; empty ⇒ create one (unless dry_run).
  string session_id = 3;
  // dry_run validates and estimates only. Nothing is created, started or spent.
  bool   dry_run = 4;
  repeated AuthoredStepOp steps = 5;
  // subject is a short human label for the plan. Empty ⇒ derived from step 0.
  string subject = 6;
}

// PlanValidationIssueOp is one problem found in an authored plan.
message PlanValidationIssueOp {
  // step_index is the offending step, or -1 for a whole-plan problem.
  int32  step_index = 1;
  // code is a stable machine token: "cycle", "out_of_bounds_dependency",
  // "empty_query", "unknown_capability", "unknown_agent", "bad_fan_out".
  string code = 2;
  string message = 3;
  // fatal distinguishes "this plan cannot run" from "this will probably not do
  // what you meant". Both are worth showing; only one blocks submission, and
  // conflating them either blocks valid plans or runs broken ones.
  bool fatal = 4;
}

message SubmitPlanOpResponse {
  string command_id = 1;
  bool   deduped = 2;
  // accepted is false when validation found a fatal issue, in which case nothing
  // was created or started regardless of dry_run.
  bool   accepted = 3;
  string session_id = 4;
  string plan_id = 5;
  repeated PlanValidationIssueOp issues = 6;
  // execution_order is the topologically-sorted step order the executor would
  // use. Returned on a dry run because "these three run in parallel and that one
  // waits" is the question a DAG author is actually asking, and a drawing of the
  // graph does not answer it past a handful of nodes.
  repeated int32 execution_order = 7;
}

// ReactivePlaneBudgetOp is the plane-wide budget picture (contract 0074).
//
// Distinct from ReactiveBudgetOp, which is a SHED EVENT — "this stream was
// dropped, here is why". These are the running totals against their caps, which
// is what a pipelines list puts above the rows: an operator needs to know how
// close the plane is to shedding BEFORE it starts, not only that it did.
//
// Every counter is -1 when not tracked, which is distinct from 0. "0 plans
// started this hour" is a claim about activity; reporting it for a counter that
// does not exist would make a busy plane look idle.
message ReactivePlaneBudgetOp {
  int64 gate_evaluations_this_hour = 1;
  int64 gate_evaluations_cap = 2;
  int64 plans_started_this_hour = 3;
  int64 plans_started_cap = 4;
  int64 signals_shed_this_hour = 5;
  // window_started_unix_ms is when the current hour window opened, so a console
  // can say "resets in 12 minutes" rather than leaving an operator to guess
  // whether a near-cap number is about to reset or about to bite.
  int64 window_started_unix_ms = 6;
}

message GetReactiveBudgetOpRequest {}

message GetReactiveBudgetOpResponse {
  ReactivePlaneBudgetOp budget = 1;
  // dead_letter_count is the current queue depth — the one figure on this screen
  // that was already real before contract 0074.
  int64 dead_letter_count = 2;
}

message GetTokenSeriesOpRequest {
  // hours of history, oldest first. 0 or out of range ⇒ the server's retention.
  int32 hours = 1;
}

// TokenSeriesPointOp is one hour of usage.
message TokenSeriesPointOp {
  int64 hour_start_unix_ms = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  // calls counts model invocations. A step that never reached a model (a cache
  // hit, a thought step) is not counted, so this measures spend rather than steps.
  int64 calls = 4;
}

message GetTokenSeriesOpResponse {
  // points are CONTIGUOUS hours, oldest first. An hour with no usage is present
  // as a zero point rather than omitted — a sparkline built from a sparse series
  // silently compresses idle time and draws a quiet night as continuous activity.
  repeated TokenSeriesPointOp points = 1;
  // retention_hours is how much history this kernel keeps, so a console can say
  // "48h" rather than implying the series is all there has ever been.
  int32 retention_hours = 2;
}

message ProposePlanOpRequest {
  string goal = 1;
  // answers replies to a previous round's questions, positionally by question
  // index. Re-send the original goal alongside them: the call is stateless, and
  // holding a half-answered interview server-side would make an abandoned one a
  // leak.
  repeated string answers = 2;
}

// InterviewOptionOp is one answer to a clarification question.
message InterviewOptionOp {
  string label = 1;
  // detail carries a REAL count — "Q2 only — 61 documents". The counts are what
  // make this a decision rather than a preference: the same two options without
  // them are a matter of taste. Resolved against the CALLER's own reachable set,
  // which is why only the kernel can compute them.
  string detail = 2;
  // document_count is the same figure as data, so a console can sort or warn on
  // it. -1 ⇒ not counted, which is NOT zero: a zero-document option is a real
  // and alarming answer, and "we could not count" is not.
  int32 document_count = 3;
}

message InterviewQuestionOp {
  string question = 1;
  // kind is "scope" (which subset of the corpus) or "judgement" (what counts as
  // done). They read differently and a console renders them differently: a scope
  // question has countable options, a judgement question does not.
  string kind = 2;
  repeated InterviewOptionOp options = 3;
  // why_it_changes_the_answer states what actually differs between the options.
  // Without it a question reads as bureaucracy and gets answered at random.
  string why_it_changes_the_answer = 4;
}

message PlanProposalOp {
  repeated AuthoredStepOp steps = 1;
  int64  estimated_tokens = 2;
  int64  estimated_wall_ms = 3;
  int32  max_parallel = 4;
  // access_note names what this plan would read and write, in the caller's own
  // terms.
  string access_note = 5;
}

message ProposePlanOpResponse {
  // questions non-empty ⇒ too vague to plan. A console must render these INSTEAD
  // of a proposal, not alongside one: offering a runnable plan next to "I need to
  // ask you something" invites approving the plan and skipping the question.
  repeated InterviewQuestionOp questions = 1;
  // proposal is present once the goal is answerable.
  PlanProposalOp proposal = 2;
  // access_consequence is volunteered BEFORE planning — what this goal would
  // touch and what that means for the answer.
  //
  // "refund logs carry customer-pii. You can read them as operator, so this will
  // work — but the answer will quote customer records, and anything written back
  // into memory inherits that label." Discovering that after the answer already
  // quotes a customer record is too late, which is why it is on the response that
  // commits to nothing rather than on the one that runs.
  string access_consequence = 3;
}

message ExplainAccessBatchOpRequest {
  // queries is the grid, flattened. Bounded server-side: a matrix large enough to
  // hurt is a matrix nobody can read, so the limit protects the kernel without
  // costing a usable screen.
  repeated ExplainAccessOpRequest queries = 1;
}

message ExplainAccessBatchOpResponse {
  // decisions are POSITIONAL — decisions[i] answers queries[i]. A failed query
  // still occupies its slot with a denial carrying the reason, because dropping
  // it would shift every later answer onto the wrong cell, and a matrix that is
  // silently off by one is worse than one that refuses to render.
  repeated AccessDecisionOp decisions = 1;
  // truncated is true when the request exceeded the server limit and only the
  // first N were evaluated. The console must say so rather than draw a partial
  // grid as if it were complete.
  bool truncated = 2;
  // limit is the server's maximum, so a client can page deliberately instead of
  // discovering the bound by hitting it.
  int32 limit = 3;
}

message BlastRadiusPreviewOpRequest {
  // mutation is one of: "tag_memory" | "set_scope" | "set_write_tags" |
  // "set_tool_grant". An unknown value is REFUSED rather than previewed as
  // no-change, because "this mutation affects nothing" and "I do not know what
  // this mutation is" must not render the same.
  string mutation = 1;
  // target_id is the agent, document or tool the mutation is aimed at.
  string target_id = 2;
  // tags / scope terms the mutation would apply, as the corresponding write RPC
  // would receive them.
  repeated string tags = 3;
  repeated string required = 4;
  repeated string any_of = 5;
  repeated string forbidden = 6;
}

// AgentImpactOp is one agent whose effective reach would change.
message AgentImpactOp {
  string agent_id = 1;
  string before = 2;
  string after = 3;
  // direction is "widened" | "narrowed" | "unchanged". Widened is the one that
  // matters: narrowing an agent breaks a task, widening one breaks a boundary,
  // and only the second is invisible afterwards.
  string direction = 4;
}

// PlanImpactOp is one in-flight plan that would need re-evaluating.
message PlanImpactOp {
  string session_id = 1;
  string plan_id = 2;
  bool   re_evaluation_required = 3;
  // reason names WHY in the operator's terms — which step, on which agent,
  // reading what.
  string reason = 4;
}

message BlastRadiusPreviewOp {
  repeated AgentImpactOp affected_agents = 1;
  repeated PlanImpactOp affected_plans = 2;
  int64 computed_at_unix_ms = 3;
  // cache_ttl_ms is how long this answer stays meaningful. A blast radius is a
  // statement about live state — agents register, plans finish — so a stale
  // preview understates, which is the direction that misleads.
  int64 cache_ttl_ms = 4;
  // complete is false when the kernel could not see everything it needed (no
  // in-flight plan registry, for instance). A partial radius rendered as total
  // is exactly the understatement this RPC exists to avoid.
  bool complete = 5;
  // incomplete_reason names what could not be inspected, so "partial" is
  // actionable rather than merely worrying.
  string incomplete_reason = 6;
}

// ConversationProgressOp is one supersedable progress snapshot (ADR-0098).
//
// Snapshots SUPERSEDE rather than accumulate: a consumer keeps the latest per
// conversation and renders one line. Appending them would turn a status line
// into a log of itself.
message ConversationProgressOp {
  string conversation_id = 1;
  // text is the rendered line ("working on it — step 2 of 4"). EMPTY means
  // CLEAR: a final update with nothing to say takes the line down.
  string text = 2;
  // phase is the machine-readable half ("thinking", "searching memory", …), so a
  // console can style without parsing the sentence.
  string phase = 3;
  // step / total_steps are 0 while the plan is still unknown — a consumer renders
  // "working on it" rather than inventing a denominator.
  int32 step = 4;
  int32 total_steps = 5;
  // final marks the turn over, successfully or not. It exists because a turn that
  // fails before replying delivers nothing, and without a terminal signal the
  // status line says "working on it" forever — which looks exactly like a hang.
  bool  final = 6;
  int64 updated_at_unix_ms = 7;
}

// ── Kernel logs (contract 0082) ─────────────────────────────────────────────

// LogAttrOp is one structured attribute, TYPED.
//
// A map<string,string> would flatten every number and boolean into text, which
// puts the console straight back to regex — the one thing retaining structured
// logs was meant to avoid. A oneof keeps `status=504` comparable as a number.
message LogAttrOp {
  string key = 1;
  oneof value {
    string s = 2;
    int64  i = 3;
    double f = 4;
    bool   b = 5;
  }
}

message LogRecordOp {
  // seq is monotonic within a boot and is the resume cursor.
  uint64 seq = 1;
  int64  at_unix_ms = 2;
  // level is "debug" | "info" | "warn" | "error".
  string level = 3;
  // component is the subsystem: an agent's logger name, or the message's own
  // prefix ("ADR-0074", "contract 0077").
  string component = 4;
  // message is the slog message with any level/logger prefix already stripped,
  // so repeat-grouping can key on it.
  string message = 5;
  repeated LogAttrOp attrs = 6;
  // boot_id changes on every process start — how a reader tells "before the
  // restart" from "after".
  string boot_id = 7;
  // truncated marks a record whose message or an attribute was clipped to keep
  // the window's memory ceiling real. Never mistake a clipped value for the
  // whole one.
  bool truncated = 8;
}

// LogFilterOp narrows a read. Every field is optional; an empty filter matches
// everything in the window.
message LogFilterOp {
  // level_at_least is "debug" | "info" | "warn" | "error". Empty = debug.
  string level_at_least = 1;
  // components matches any of these exactly. Empty = every component.
  repeated string components = 2;
  // contains is a case-insensitive substring over the message. It is ONE term
  // among several rather than the only filter — that is the whole argument for
  // retaining attributes typed.
  string contains = 3;
  // attr_equals matches records carrying this attribute with this value, compared
  // as text. This is the field query the console's filter chips build.
  map<string, string> attr_equals = 4;
  // since_unix_ms bounds the window from below. 0 = as far back as the ring goes.
  int64 since_unix_ms = 5;
}

// LogWindowOp describes what the ring can currently answer for.
//
// It rides on every response because a window that silently has nothing behind
// it is worse than one that says how far back it reaches.
message LogWindowOp {
  string boot_id = 1;
  int32  capacity = 2;
  int32  count = 3;
  // dropped counts records overwritten since boot. Non-zero means the window no
  // longer reaches back to process start, and a console must say so.
  uint64 dropped = 4;
  int64  oldest_unix_ms = 5;
  int64  newest_unix_ms = 6;
  // last_seq is the newest sequence issued — where a tail should resume from.
  uint64 last_seq = 7;
}

message QueryLogsOpRequest {
  LogFilterOp filter = 1;
  // after_seq returns only records newer than this. 0 = from the oldest retained.
  uint64 after_seq = 2;
  // limit caps the returned records, newest-biased when the window is larger.
  // 0 defaults to a server-side cap.
  int32 limit = 3;
}

message QueryLogsOpResponse {
  repeated LogRecordOp records = 1;
  LogWindowOp window = 2;
}

message TailLogsOpRequest {
  LogFilterOp filter = 1;
  // after_seq resumes a tail. 0 starts from the live edge rather than replaying
  // the whole window — a tail is for what happens next; QueryLogs is for history.
  uint64 after_seq = 2;
}


message GetDocumentOpRequest {
  string id = 1;
}
message GetDocumentOpResponse {
  // found is false for an id no document carries. Distinct from an empty body: a
  // dangling citation and a blank document are different answers, and a console
  // resolving a reference has to tell them apart.
  bool found = 1;
  string id = 2;
  string text = 3;
  string summary = 4;
  string document_type = 5;
  repeated string tags = 6;
  string source = 7;
  int64 created_at_unix_ms = 8;
}

// ── Reactive pipelines (contract 0087) ──────────────────────────────────────

message ListNodeItemsOpRequest {
  string pipeline_id = 1;
  string node_id = 2;
  // Newest first. Bounded by the server; 0 means its default.
  int32 limit = 3;
}

message NodeItemOp {
  string run_id = 1;
  string item_key = 2;
  string state = 3;
  int32 attempt = 4;
  // The envelope this task consumed and what it produced, as JSON. The result
  // of a save carries WHAT it wrote, which is the thing worth reading.
  string input_json = 5;
  string result_json = 6;
  string error = 7;
  // The material this item derives from (RP-6).
  string evidence_ref = 8;
  string updated_at = 9;
  // Iteration path through enclosing loops, empty outside one.
  string iter_path = 10;
}

message ListNodeItemsOpResponse {
  repeated NodeItemOp items = 1;
  string error = 2;
}

message ListPipelinesOpRequest {
  // armed_only narrows to what is LIVE. The default is every revision, because
  // "which revisions exist and which one is armed" is the question an operator
  // has when deciding whether to roll back.
  bool armed_only = 1;
  // ingress_id narrows to one ingress's pipeline. Empty means all.
  string ingress_id = 2;
}

message ListPipelinesOpResponse {
  repeated PipelineOp pipelines = 1;
}

// ── Pipeline dry run (contract 0088) ────────────────────────────────────────

message DryRunPipelineOpRequest {
  string pipeline_id = 1;
  // revision 0 means the latest authored revision.
  int32 revision = 2;
  // sample_limit caps how many captured deliveries are replayed. 0 means the
  // server's default.
  int32 sample_limit = 3;
}

message DryRunPipelineOpResponse {
  // refused carries the named constraint when the run could not happen at all.
  // Set means every other field is empty — a console must render this instead
  // of an empty report, which would look like a clean one.
  string refused = 1;
  string run_id = 2;
  // samples is how many captured deliveries were replayed. Zero is reported as
  // zero, never as a clean result.
  int32 samples = 3;
  repeated ShadowEffectOp effects = 4;
  repeated DuplicateEffectKeyOp duplicates = 5;
  repeated PipelineTerminationOp terminations = 6;
  // failures are items a node could not process — the red count, kept separate
  // from the declared discards because a discard is intended and a failure is
  // not. NOT "unrouted": the compiler refuses a graph with an unwired port, so
  // an item reaching no port at all is structurally impossible.
  repeated PipelineFailureOp failures = 7;
  // elapsed_ms is how long the replay took — the figure that says whether
  // running it over more deliveries is worth doing.
  int64 elapsed_ms = 8;
  // source names what was replayed (contract 0092): the archive's real
  // deliveries, or the redacted capture samples. Load-bearing for reading the
  // report — over redacted samples every value is a type token, so a numeric
  // gate fails on every item, and only this field lets a reader blame the
  // source rather than the graph.
  string source = 9;
  // node_examples are real items observed per node during the replay — the
  // value as the node received it, and the node's own receipt where it
  // recorded one. Bounded per node kernel-side: a panel a person reads.
  repeated PipelineNodeExampleOp node_examples = 10;
}

// PipelineNodeExampleOp is one item as one node saw it during a dry run.
message PipelineNodeExampleOp {
  string node = 1;
  string item_key = 2;
  // value_json is the item's value as the node received it.
  string value_json = 3;
  // result_json is what the node recorded (an effect's receipt), when any.
  string result_json = 4;
}

// PipelineFailureOp is one item a node could not process.
message PipelineFailureOp {
  string node = 1;
  string item_key = 2;
  string err = 3;
}

// ── Pipeline authoring (contract 0089) ──────────────────────────────────────

message GetPipelineOpRequest {
  string pipeline_id = 1;
  // revision 0 means the latest authored revision.
  int32 revision = 2;
}

message GetPipelineOpResponse {
  // refused is set when the revision cannot be read at all.
  string refused = 1;
  PipelineOp summary = 2;
  // graph_json is the ADR-0114 pipeline document, as authored.
  //
  // JSON rather than a mirrored message because the graph is recursive — a
  // structured-control node owns a nested scope — and every node carries an
  // open configuration map. A mirror would be a second schema to keep in step,
  // and the drift would surface as a node kind the console cannot render.
  string graph_json = 3;
  // refusals is what the compiler says about this revision right now.
  repeated RefusalOp refusals = 4;
  // reads names, per node, the payload paths that node's expressions look at —
  // taken from the compiled AST, so it cannot disagree with what the runtime
  // will read.
  repeated NodeReadsOp reads = 5;
  // field_schema_json is the per-node field schema (contract 0091): for every
  // node, the fields available to its expressions — walked from the trigger's
  // capture profile through each transform — plus what it reads, writes and
  // drops, and, where a shape is not statically knowable, the reason, named.
  // JSON for the same reason as graph_json. Empty means "unchecked", never
  // "no fields".
  string field_schema_json = 6;
}

// NodeReadsOp is one node and the payload paths it reads.
message NodeReadsOp {
  string node = 1;
  // paths are qualified by their root: `item.x`, `signal.y`. A path of
  // `item.*` means the node reads the whole payload.
  repeated string paths = 2;
}

message ValidatePipelineOpRequest {
  string graph_json = 1;
}

message ValidatePipelineOpResponse {
  // refused means the DOCUMENT could not be read — malformed JSON, say.
  // Distinct from a refusal list, which means it was read and broke rules.
  string refused = 1;
  repeated RefusalOp refusals = 2;
  // The plan facts a canvas header shows once it compiles. Zero when it does not.
  int32 node_count = 3;
  int32 effect_node_count = 4;
  string plan_checksum = 5;
  string semantics_checksum = 6;
  // field_schema_json is the per-node field schema of the DRAFT being
  // validated — same shape as GetPipelineOpResponse.field_schema_json, so the
  // picker tracks the graph as it is edited. Empty when the draft does not
  // compile.
  string field_schema_json = 7;
}

message SavePipelineOpRequest {
  string graph_json = 1;
  // command_id makes the save idempotent under retry.
  string command_id = 2;
}

message SavePipelineOpResponse {
  // refused is set when nothing was stored at all.
  string refused = 1;
  string pipeline_id = 2;
  // revision is the DRAFT revision created. Editing never overwrites a revision
  // that is published, armed or retired — a run pins a revision.
  int32 revision = 3;
  // refusals is what the compiler said about the stored draft. Present and
  // non-blocking: they hold Publish, not Save.
  repeated RefusalOp refusals = 4;
}

message TransitionPipelineOpRequest {
  string pipeline_id = 1;
  // revision 0 means the latest authored revision.
  int32 revision = 2;
  // to_state is one of: validated, published, armed, paused, retired.
  string to_state = 3;
  // command_id makes the transition idempotent under retry; reason is the
  // operator's own words, audited like every mutating command.
  string command_id = 4;
  string reason = 5;
}

message TransitionPipelineOpResponse {
  // refused names the gate that held, in the registry's own words. The
  // revision is untouched when set.
  string refused = 1;
  string pipeline_id = 2;
  int32 revision = 3;
  // state is where the revision IS now — the store's answer, never an echo
  // of the request.
  string state = 4;
}

// RefusalOp is one constraint a graph broke, and where it broke it.
message RefusalOp {
  // constraint is the STABLE rule identifier. A console keys behaviour off it —
  // which refusals offer "wire it", which offer "terminate it with a reason" —
  // so it must not change when the wording does.
  string constraint = 1;
  // node and port are empty when the refusal is about the pipeline or a whole
  // scope. A console offers "take me there" only when node is set.
  string node = 2;
  string port = 3;
  // message names the constraint, then the action. Never a validity verdict.
  string message = 4;
}

// ShadowEffectOp is one effect that would have been carried out.
message ShadowEffectOp {
  string node = 1;
  string kind = 2;
  // effect_key is the real derived key, not a placeholder.
  string effect_key = 3;
  string item_key = 4;
  string summary = 5;
}

// DuplicateEffectKeyOp is one key more than one effect would have used.
message DuplicateEffectKeyOp {
  string effect_key = 1;
  int32 count = 2;
  repeated string nodes = 3;
}

// PipelineTerminationOp is one declared discard and how many items took it.
message PipelineTerminationOp {
  string node = 1;
  string port = 2;
  // reason is the operator's own words from the spec.
  string reason = 3;
  int32 count = 4;
}

// PipelineOp is one authored revision.
message PipelineOp {
  string pipeline_id = 1;
  int32 revision = 2;
  string name = 3;
  // state is the D3 lifecycle position: draft, validated, published, armed, retired.
  string state = 4;
  // trigger_type is "ingress", "stream", "schedule" or "manual"; trigger_ref is
  // the ingress id, stream id or cron expression it names.
  string trigger_type = 5;
  string trigger_ref = 6;
  int32 node_count = 7;
  int32 edge_count = 8;
  // effect_node_count is called out because it is the change class that can
  // touch the world — the number an operator checks before arming.
  int32 effect_node_count = 9;
  // mapping_revision is the ingress mapping this graph was generated for, 0 for
  // a hand-authored pipeline bound to no mapping.
  int32 mapping_revision = 10;
  // plan_checksum pins the compiled plan; semantics_checksum is the
  // revision-independent fingerprint, so two revisions that differ only
  // cosmetically compare equal (ADR-0114 D29).
  string plan_checksum = 11;
  string semantics_checksum = 12;
  // generated is true when the Ingress Studio authored this revision rather
  // than an operator editing the canvas.
  bool generated = 13;
  // dry_run evaluates everything and performs no effect (REACT-05). Surfaced
  // because "it has decided N times and acted zero times" is the whole point of
  // the mode, and a console that cannot see it shows a live-looking pipeline.
  bool dry_run = 14;
  // approved is the operator's acknowledgement for a high-risk pipeline.
  bool approved = 15;
  // entry_live reports whether the daemon feeding this pipeline is running.
  //
  // Three-valued: UNSET means nobody can tell, which is a different claim from
  // "not running" and only one of them is a problem. An armed pipeline whose
  // entry organ is switched off looks identical to a working one in the store —
  // the graph is armed either way — and that difference is the whole question
  // when a bot stops answering.
  optional bool entry_live = 16;
}
