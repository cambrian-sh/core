syntax = "proto3";

package cambrian;

option go_package = "core/api/proto";

import "google/protobuf/timestamp.proto";

// Cambrian Object Model
message Object {
  string id = 1;
  string type = 2;
  bytes data = 3; // JSON veya binary veri
  map<string, string> metadata = 4;
}

// ContextRef is a lightweight handle to a piece of content in the ContentStore.
// ADR-0022 Phase 3: replaces the flat context map in Handoff.
message ContextRef {
  string cid = 1;               // SHA-256 hex, CAS key
  string type = 2;              // "step_result", "ltm_doc", "verification"
  repeated string labels = 3;   // searchable tags
  float activation = 4;         // spreading activation energy (0-1) — structural relevance
  string snippet = 5;           // first context_ref_snippet_chars of UTF-8 content
  float precision = 6;          // cosine similarity (0-1), or -1.0 if not yet computed
}

// Handoff Protokolü
message Handoff {
  string id = 1;
  string from_agent = 2;
  string to_agent = 3;
  Object payload = 4;
  float confidence = 5;
  repeated string uncertainties = 6;
  // REMOVED: flat context map (was the O(N²) growing step-result dump). Field 7 reserved.
  reserved 7;
  // NEW (ADR-0022 Phase 3): capacity-limited Global Workspace (content).
  // Populated when use_global_workspace=true. Carries CAS content refs, not raw strings.
  repeated ContextRef working_memory = 8;
  // NEW (ADR-0022 Phase 3): control/routing metadata (not content context).
  // Carries small fixed metadata: _session_token_id, _step_index, _capability,
  // HITL signals (signal=y/n/e), mode (direct_retrieval / task_orchestration).
  // Separated from working_memory so metadata never inflates the token budget.
  map<string, string> metadata = 9;
}

service Orchestrator {
  // The main method where the agent receives and processes a task (if the Orchestrator also implements this service)
  rpc Execute(Handoff) returns (Handoff);

  // DEPRECATED: Auction / Qualified-Volunteering Model. The auction was retired by
  // ADR-0100 and the kernel serves no bids. Kept so the contract stays
  // wire-compatible; do not build on it.
  rpc RequestProposal(AuctionTask) returns (AgentProposal);

  // Shared LTM semantic query — proxied through Substrate with ACL enforcement
  rpc QueryMemory(MemoryRequest) returns (MemoryResponse);

  // Bi-directional TUI shell stream. Upstream: user commands (Handoff).
  // Downstream: real-time telemetry envelope (SymbiosisEvent).
  rpc ChatStream(stream Handoff) returns (stream SymbiosisEvent);

  // Proactive neural signal stream. Upstream: agent signals (Handoff with _signal_type).
  // Downstream: plan execution telemetry (SymbiosisEvent).
  rpc SignalStream(stream Handoff) returns (stream SymbiosisEvent);

  // Managed LLM call: the Substrate acts as a metered proxy, forwarding chunks
  // from the allocated TraitModel to the agent with per-chunk token accounting.
  // ADR-0018.
  rpc GenerateViaModelStream(GenerateStreamRequest) returns (stream GenerateChunk);

  // ADR-0097 Phase B: one managed generation turn WITH native tool-calling.
  //
  // Unary, not streaming, deliberately. A tool call is only actionable once it is
  // complete — name plus a fully-formed argument object — so streaming it buys
  // nothing an agent can use and forces every client to reassemble partial calls.
  // Text-only generation keeps using GenerateViaModelStream, which still streams.
  //
  // Callers must treat Unimplemented / FailedPrecondition as "this deployment has
  // no native tool support" and fall back to the prompt-encoded action protocol.
  rpc GenerateWithTools(GenerateWithToolsRequest) returns (GenerateWithToolsResponse);

  // Resolve a CID from the ContentStore (step results) or LTM pgvector.
  // Used by agents' assemble_context(fetch_fn=agent.substrate.get_context_node).
  // Returns empty data when the CID is unknown. ADR-0022 Phase 3.
  rpc GetContextNode(ContextNodeRequest) returns (ContextNodeResponse);

  // Store a content blob in the ephemeral ContentStore and return its CID
  // (ADR-0048 D4/R7). Used by an agent's working memory to offload a large block
  // and carry a {gist + cid} pointer; the blob is owner-stamped with the caller's
  // session so reads are gated (GetContextNode). Idempotent (content-addressed).
  rpc PutContextNode(PutContextNodeRequest) returns (PutContextNodeResponse);

  // Contract 0099: the four Orchestrator watch-CRUD RPCs (RegisterWatch,
  // ListWatches, DeleteWatch, SetWatchActive) and their messages were REMOVED.
  // They duplicated the OperatorConsole watch commands on the agent plane with no
  // authentication, audit row, reason or command-id dedup, and were retired in place
  // on 2026-10-31. Use OperatorConsole/{Register,List,Delete}Watch and
  // SetWatchActive, which are authenticated and audited.

  // Artifact storage with ADR-0034 tag-based access scoping. REQ-SDK-007c.
  // Upload validates classification tags against the writer's scope + controlled
  // vocabulary and kernel-stamps provenance before persisting.
  rpc UploadArtifact(UploadArtifactRequest) returns (UploadArtifactResponse);
  // Get an artifact by content hash; returns empty when the caller's effective
  // scope does not permit the artifact's tags (fail-closed).
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  // List artifacts produced by a session+step, scope-filtered for the caller.
  rpc ListStepArtifacts(ListStepArtifactsRequest) returns (ListStepArtifactsResponse);

  // memory.remember() write-back. The kernel DERIVES classification from the
  // agent's DefaultWriteTags (ADR-0035 C2); req.tags is a narrow-only hint.
  rpc IngestMemory(IngestMemoryRequest) returns (IngestMemoryResponse);

  // ADR-0039: kernel-owned tool registry. A cognitive agent invokes a granted
  // system tool with LLM-marshalled args; the kernel authorizes (grant +
  // resource policy + data scope + approval) and runs it in a confined process.
  // The principal is taken from x-agent-id gRPC metadata, never from the body.
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  // ADR-0039: the system tools the calling agent (x-agent-id) may invoke, for
  // building the agent's closed ReAct tool menu. Advisory only — ExecuteTool
  // still authorizes every call. Honors the unrestricted bypass.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // ADR-0046: the system skills the calling agent (x-agent-id) may load, for the
  // agent's [skills] menu section. Tier-1 (summary) by default; Tier-2 (full
  // instructions) for a named skill via use_skill. Scope-gated; agent-local
  // skills are NOT served here (they are SDK-local, the @tools analog).
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  // ADR-0041: embed text into a vector using the kernel's embedder, for the
  // agent's Local Recurrent Workspace relevance ranking. Read-only; no auth impact.
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  // Operator-plane: stream pending dangerous-tool approval requests (ADR-0039 D10).
  rpc WatchApprovals(WatchApprovalsRequest) returns (stream ApprovalRequest);
  // Operator-plane: submit an approve/deny decision for a pending request.
  rpc SubmitApprovalDecision(ApprovalDecisionRequest) returns (ApprovalDecisionResponse);

  // ── ADR-0139 Phase 2/3 (C7): subagents, memory notes, skill proposals ────────
  //
  // All four are additive. A kernel that does not serve one answers UNIMPLEMENTED
  // (the generated UnimplementedOrchestratorServer does that), and a client MUST
  // treat UNIMPLEMENTED as "this deployment has no such surface", never as a
  // failed call to retry. The principal is the x-agent-id metadata plus the
  // lease, as on ExecuteTool, never a body field.

  // ADR-0139 D12: spawn one in-agent subagent and wait for its result (unary:
  // the parent awaits). The child is a SEPARATE kernel dispatch, so the
  // ToolExecutor governs every child tool call and child spend counts against
  // the ROOT lease (tree-wide, D1). Cancelling this call MUST cancel the child.
  //
  // No streaming variant, deliberately: the parent can act only on the final
  // result, the child's progress is already visible on the C6 run event log and
  // the operator feed, and a stream would need the C7 cancellation/resume
  // protocol, which is not frozen yet.
  //
  // Request-shape faults are gRPC errors (INVALID_ARGUMENT; a missing, foreign or
  // expired lease is PERMISSION_DENIED). Everything that happens TO the child,
  // including a policy refusal, is an OK response with an exit_reason, so the
  // parent model sees it as a tool result.
  rpc SpawnSubagent(SpawnSubagentRequest) returns (SpawnSubagentResponse);

  // ADR-0139 D14 / D3: the run principal's memory notes as the FROZEN run-start
  // snapshot. Every call within one run MUST return the same snapshot (same
  // version), even after a ProposeMemoryNote in that run: writes are durable at
  // once but appear from the next run, which keeps the prompt cache intact.
  rpc GetMemoryNotes(GetMemoryNotesRequest) returns (GetMemoryNotesResponse);

  // ADR-0139 D14: write to the run principal's notes (append, replace a section,
  // remove a section). Bounded and injection-scanned on write; a refused write is
  // an OK response with accepted=false and a rejection, never a silent trim or
  // eviction.
  rpc ProposeMemoryNote(ProposeMemoryNoteRequest) returns (ProposeMemoryNoteResponse);

  // ADR-0139 D13: propose a skill (new, or an edit of an existing one). It enters
  // the staged approval queue as PENDING and is NEVER active until an operator
  // approves it (OperatorConsole/DecideSkillProposal).
  rpc ProposeSkill(ProposeSkillRequest) returns (ProposeSkillResponse);

  // ADR-0139 amendment 2026-11-06 (live step-output stream; additive within
  // contract 0101, capability "step-output-stream"): an agent that calls its OWN
  // model (Claude Code / the Claude Agent SDK as a worker, LangGraph, a custom
  // agent) pushes its step's live output here; it reaches the operator feed
  // (TokenChunkOp) and MCP progress like the gateway's deltas do. Every chunk is
  // bound to the step's lease: a dead lease, or one not issued to the caller, is
  // PERMISSION_DENIED. seq is strictly increasing per lease; a chunk at or below
  // the highest accepted seq is a duplicate (a retried stream) and is dropped. An
  // agent that pushes should declare streams_output (profile / manifest) so the
  // kernel stops forwarding gateway deltas for its steps.
  rpc EmitStepOutput(stream StepOutputChunk) returns (EmitStepOutputAck);
}

// StepOutputKind classifies one pushed chunk.
enum StepOutputKind {
  STEP_OUTPUT_KIND_UNSPECIFIED = 0; // read as TEXT
  STEP_OUTPUT_KIND_TEXT = 1;        // a fragment of the step's output text
  STEP_OUTPUT_KIND_PROGRESS = 2;    // a progress note ("reading 3 of 7 files")
  STEP_OUTPUT_KIND_STATUS = 3;      // a status note
}

// StepOutputChunk is one chunk of a step's live output, pushed by its agent.
message StepOutputChunk {
  string lease_id = 1;   // the step's lease; every chunk names it
  uint64 seq = 2;        // strictly increasing per lease, from 1
  StepOutputKind kind = 3;
  string data = 4;       // capped per chunk and per step (execution.step_output.*)
  bool final = 5;        // the agent's last chunk for the step; later chunks are dropped
}

// EmitStepOutputAck summarises one EmitStepOutput stream.
message EmitStepOutputAck {
  uint64 accepted = 1;           // chunks delivered
  uint64 duplicates = 2;         // dropped: seq not above the highest accepted
  uint64 over_cap = 3;           // dropped: the step's byte cap was reached
  uint64 after_final = 4;        // dropped: the agent had already sent final
  uint64 last_seq = 5;           // the highest seq accepted on this stream
}

// ADR-0039 tool-execution messages.
message ExecuteToolRequest {
  string tool_name = 1;
  string args_json = 2;        // marshalled by the agent's think() loop
  // DEPRECATED: use lease_id. This field never carried a "session" — it carries the
  // per-step BudgetLease (ADR-0018). The name is what let the lease be read as a durable
  // task session downstream. Kept for wire compatibility; readers prefer lease_id.
  string session_token_id = 3 [deprecated = true];
  int32 step_index = 4;
  // lease_id is the opaque per-step BudgetLease the kernel issued at dispatch. It is a
  // CREDENTIAL: the kernel resolves it to the session/run/step it bound, so an agent
  // never names its own session.
  string lease_id = 5;
}
message ExecuteToolResponse {
  string result_json = 1;
  string result_cid = 2;       // set when the result was offloaded to the ContentStore
  bool denied = 3;
  string deny_reason = 4;
  string error = 5;
  string arg_hash = 6;
  string result_hash = 7;
}
// ADR-0039 tool-discovery messages. The principal is taken from x-agent-id
// metadata, never from the body.
message ListToolsRequest {}
message ToolDescriptor {
  string name = 1;
  string description = 2;
  string schema_json = 3;   // JSON Schema for the LLM tool-calling menu
  bool dangerous = 4;       // gates on operator approval at execute time
}
message ListToolsResponse {
  repeated ToolDescriptor tools = 1;
}

// ADR-0046 skill-discovery messages. The principal is taken from x-agent-id
// metadata; query/k/names/full ride x-skill-* metadata (mirroring x-tool-*).
message ListSkillsRequest {}
message SkillDescriptor {
  string name = 1;
  string description = 2;          // Tier-1 one-line summary (always served)
  string instructions = 3;         // Tier-2 SKILL.md body (only when full=true / use_skill)
  repeated string tool_grants = 4; // bundled tools activated run-scoped on load (Tier-2)
  // Per-agent skill access (decisions/skill-access-grants.md, additive). For an
  // agent the kernel bounds (a profile agent) the effective skill set is its
  // profile's skills plus its operator-approved grants, and a body is served only
  // inside it. access says where this skill stands for the caller:
  //   "profile" | "granted"  in the effective set (a body is served on use_skill)
  //   "requestable"          visible but outside the set (find_skills); use_skill
  //                          asks an operator on the approval hub
  //   "pending"              asked; no decision in time. The request stays open and
  //                          an approval applies to later runs
  //   "denied"               an operator denied it (or the kernel keeps no grants)
  // "" = this agent is not bounded (no profile): the pre-grant behaviour. A
  // use_skill request may carry x-skill-rationale metadata (shown to the operator).
  string access = 5;
  string access_detail = 6;        // human-readable reason for pending / denied
}
message ListSkillsResponse {
  repeated SkillDescriptor skills = 1;
}

// ADR-0041 embedding messages (Local Recurrent Workspace relevance ranking).
message EmbedRequest {
  string text = 1;
}
message EmbedResponse {
  repeated float vector = 1;
}

// ADR-0039 D10 approval-channel messages (operator plane).
message WatchApprovalsRequest {}
message ApprovalRequest {
  string id = 1;
  string agent_id = 2;
  string tool_name = 3;
  string args_preview = 4;
  // "" = a dangerous-tool approval (ADR-0039); "skill_access" = an agent asks for
  // a skill outside its effective set (tool_name "skill:<name>"; approving grants
  // it durably to that agent, decisions/skill-access-grants.md). Additive.
  string kind = 5;
}
message ApprovalDecisionRequest {
  string id = 1;
  bool approve = 2;
  string approver_id = 3;
}
message ApprovalDecisionResponse {
  bool ok = 1;
}

// ADR-0035 memory write-back.
//
// Event time (ADR-0134 D1, contract 0099). Every field below `session_id` is
// optional; a client that sends none of them gets today's behaviour.
//
// The shared time vocabulary (also used by MemoryResult and the operator plane):
//   time_source    "explicit"        the caller stated the time (occurred_at / part times)
//                  "source_metadata" read from the source itself by a declared rule
//                  "inferred"        derived by a declared rule
//                  "ingest_default"  nothing was known; the time IS the ingest time
//                  "clamped_future"  the caller stated a time too far in the future;
//                                    the event time was clamped to the ingest time
//   time_precision "year" | "month" | "day" | "hour" | "minute" | "second"
// The kernel's single definition is cambrian-core domain/event_time.go.
message IngestMemoryRequest {
  string text       = 1;
  repeated string tags = 2; // narrow-only classification hint (can only restrict)
  double importance = 3;
  string source     = 4;
  string session_id = 5;
  // occurred_at is when the content HAPPENED (valid time), as opposed to when
  // Cambrian records it (the ingest time). Unset means unknown: the kernel uses the
  // ingest clock and labels it "ingest_default", never as a real time.
  //
  // A Timestamp is an absolute UTC instant, so a zone-less ("naive") local time
  // cannot be expressed on the wire: a client converts a zone-aware time and must
  // REFUSE a naive one rather than guess its zone (the Python SDK does). A time
  // later than ingest + execution.ingestion.event_time_future_tolerance_ms (default
  // 5 minutes) is accepted but clamped to the ingest time; the claimed time is kept
  // beside it and time_source becomes "clamped_future". An invalid Timestamp
  // (outside years 1-9999, bad nanos) is INVALID_ARGUMENT.
  google.protobuf.Timestamp occurred_at = 6;
  // parts carries multi-message content, e.g. a chat session's turns, each with its
  // own time. Mutually exclusive with `text` (both set is INVALID_ARGUMENT). The
  // kernel joins the parts' text in order, separated by a blank line, into the
  // document body. Chunk boundaries are NOT forced at part boundaries: a chunk's
  // event time is the earliest time of the parts it covers, and its span end
  // (event_time_end on a hit) the latest. When occurred_at is unset, the
  // document's event time is the earliest part time.
  repeated MemoryPart parts = 7;
  // time_precision states how precise occurred_at and the part times are, from the
  // vocabulary above, so a date-only source is never shown as an exact instant.
  // Empty means "second" when a time is given. An unknown value is INVALID_ARGUMENT.
  string time_precision = 8;
  // ADR-0136 Amendment A3: DESCRIPTIVE source metadata, all optional. The kernel
  // trims each to a configured cap (execution.ingestion.source_*_max_chars) and
  // rejects control characters (INVALID_ARGUMENT). None of them is identity or
  // routing: the writer of record (source_agent_id) stays the authenticated caller,
  // and the kernel's own source type (which parser routing reads) is unchanged.
  //
  // source_kind is free text describing the source ("conversation", "email",
  // "report", ...). Never an enum, and nothing branches on it; the fact extractor
  // shows it to the model as data.
  string source_kind = 9;
  // title is the source's own title. Unset: the body's first line, as before.
  string title = 10;
  // author is the source's author as the source names it. Descriptive only.
  string author = 11;
}
// MemoryPart is one timed part of a multi-part memory (ADR-0134 D1).
message MemoryPart {
  string text = 1;
  // occurred_at is this part's event time. Optional: a part with no time
  // contributes text but no time.
  google.protobuf.Timestamp occurred_at = 2;
  // speaker is who speaks or writes this part (a name or role label; ADR-0136 A3).
  // Optional and descriptive. It never changes the assembled body: every chunk
  // records the speaker at its first character and the speakers it overlaps.
  string speaker = 3;
}
message IngestMemoryResponse {
  string doc_id = 1;
}

// ADR-0034 / REQ-SDK-007c artifact messages.
message UploadArtifactRequest {
  bytes content = 1;
  string content_type = 2;
  string session_id = 3;
  int32 step_index = 4;
  repeated string tags = 5; // requested classification tags (validated server-side)
  string semantic_summary = 6;
}
message UploadArtifactResponse {
  string hash = 1;
  repeated string tags = 2; // effective tags after validation + provenance stamping
}
message GetArtifactRequest {
  string hash = 1;
}
message GetArtifactResponse {
  bytes content = 1;
  string content_type = 2;
  repeated string tags = 3;
  bool found = 4; // false when absent OR scope-denied (fail-closed; indistinguishable by design)
}
message ListStepArtifactsRequest {
  string session_id = 1;
  int32 step_index = 2;
}
message ArtifactMeta {
  string hash = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  repeated string tags = 4;
  string semantic_summary = 5;
}
message ListStepArtifactsResponse {
  repeated ArtifactMeta artifacts = 1;
}

// ContextNodeRequest is used to dereference a CID. ADR-0022 Phase 3.
message ContextNodeRequest {
  string cid = 1;
}

// ContextNodeResponse carries the resolved content for a given CID.
// Returns empty data when the CID is unknown (caller falls back to snippet).
message ContextNodeResponse {
  string cid = 1;
  string type = 2;
  bytes data = 3;
  repeated string labels = 4;
}

message PutContextNodeRequest {
  bytes data = 1;
  string node_type = 2; // optional content classification; defaults to "agent_offload"
}
message PutContextNodeResponse {
  string cid = 1;
}

// StatusUpdate carries connection health to the TUI status bar.
message StatusUpdate {
  string status = 1; // "Connected" | "Reconnecting" | "Disconnected"
  string detail = 2;
}

// ThoughtChunk streams a reasoning fragment from the Planner to the Cortex pane.
message ThoughtChunk {
  string text = 1;
  bool   done = 2; // true on the final chunk; TUI collapses the node to a checkmark
}

// AgentLog streams a structured log line from an agent to the Execution pane.
message AgentLog {
  string timestamp = 1; // RFC3339
  string level     = 2; // DEBUG | INFO | WARN | ERROR
  string message   = 3;
  string agent_id  = 4;
}

// StepType classifies a plan step for HITL routing.
enum StepType {
  STEP_TYPE_ACTION       = 0;
  STEP_TYPE_THOUGHT      = 1;
  STEP_TYPE_INTERVENTION = 2;
}

// InterventionRequest is streamed by the kernel when a DAG step requires
// human-in-the-loop confirmation before execution can proceed.
message InterventionRequest {
  int32  step_index   = 1;
  string description  = 2;
  bool   is_destructive = 3;
  StepType step_type  = 4;
}

// BidEntry represents a single agent's proposal in an auction.
message BidEntry {
  string agent_id      = 1;
  float  confidence    = 2;
  string rationale     = 3;
  int32  latency_ms    = 4;
  bool   is_tool       = 5; // true when the bid came from a TraitTool Static Bidder
}

// AuctionEvent streams structured auction results from the Auctioneer to the TUI.
message AuctionEvent {
  string              task_id       = 1;
  string              task_desc     = 2;
  string              status        = 3; // "started" | "completed" | "failed"
  string              winner_id     = 4;
  repeated BidEntry   bids          = 5;
  string              error_msg     = 6;
}

// PlanStep describes a single step in the execution plan topology.
message PlanStep {
  int32  index       = 1;
  string query       = 2;
  repeated int32 depends_on = 3;
  bool   is_thought  = 4;
}

// PlanTopology streams the full DAG structure before step execution begins.
message PlanTopology {
  repeated PlanStep steps = 1;
  string            subject = 2;
}

// StepCacheHit is streamed when a DAG step result is served from the
// StepCache without calling the agent (ADR-0026). TUI renders the step
// node as greyed-out with a "↻ cached" badge.
message StepCacheHit {
  int32  step_index = 1;
  string key        = 2;
}

// SymbiosisEvent is the oneof envelope streamed from Substrate to TUI.
message SymbiosisEvent {
  oneof payload {
    StatusUpdate        status_update        = 1;
    ThoughtChunk        thought_chunk        = 2;
    AgentLog            agent_log            = 3;
    InterventionRequest intervention_request = 4;
    AuctionEvent        auction_event        = 5;
    PlanTopology        plan_topology        = 6;
    StepCacheHit        step_cache_hit       = 7;
  }
}

// Service that agents register with, or that agents implement (AgentService)
service AgentService {
  // DEPRECATED 2026-11-05: the kernel no longer calls RequestProposal. Its last
  // caller was the LLM agent interview, deleted 2026-11-05 (ADR-0139 Q3); the
  // auction's bid round was retired earlier (ADR-0100). Agents may still serve it;
  // nothing asks. Kept so the contract stays wire-compatible.
  rpc RequestProposal(ProposalRequest) returns (ProposalResponse);
  rpc Execute(Handoff) returns (Handoff);
  rpc VerifyOutput(VerifyRequest) returns (VerifyResponse);
}

message ProposalRequest {
  string task_id = 1;
  string description = 2;
  string context = 3;
  google.protobuf.Timestamp deadline = 4;
  float confidence_hint = 5;
}

message ProposalResponse {
  float confidence = 1;
  string rationale = 2;
  repeated string requirements = 3;
  int32 estimated_latency_ms = 4;
  map<string, string> metadata = 5;
}

// Auction request
message AuctionTask {
  string id = 1;
  string description = 2;
  string context = 3;
}

// Agent bid
message AgentProposal {
  string agent_id = 1;
  string task_id = 2;
  float confidence = 3;
  string rationale = 4;
  repeated string requirements = 5;
  int32 latency_ms = 6;
}

// Verifier Pool: judicial scoring request
message VerifyRequest {
  string task_id = 1;
  string original_query = 2;
  string winner_output = 3;
  string winner_agent_id = 4;
  float bid_confidence = 5;
}

// Verifier Pool: judicial scoring response
message VerifyResponse {
  float quality_score = 1;
  string critique = 2;
}

// LTM semantic query request
message MemoryRequest {
  string query = 1;
  int32 top_k = 2;
  // Event-time query parameters (ADR-0134 D4, contract 0099). All optional.
  //
  // reference_time is the asker's "now": relative expressions in the question
  // ("last month", "most recently") resolve against it. Unset means the server's
  // clock. For a benchmark it is the dataset's question date. It does not filter
  // anything by itself. NOT named as_of: as_of is reserved for transaction time
  // ("what did our records hold at T"), as on the premium substrate plane.
  google.protobuf.Timestamp reference_time = 3;
  // event_after / event_before bound the event-time window: a hit is kept when its
  // event-time span [event_time, event_time_end] overlaps [event_after,
  // event_before) — event_after inclusive, event_before exclusive. Either bound
  // may be unset (open). event_after >= event_before is INVALID_ARGUMENT. The
  // window is applied INSIDE retrieval beside the read scope, never after top-k;
  // a kernel that cannot apply it answers UNIMPLEMENTED rather than ignoring it.
  google.protobuf.Timestamp event_after = 4;
  google.protobuf.Timestamp event_before = 5;
}

// Single LTM search result
message MemoryResult {
  string text = 1;
  float score = 2;
  string metadata = 3;
  // Event time of the hit (ADR-0134, contract 0099); vocabulary on
  // IngestMemoryRequest. event_time is when the content happened, falling back to
  // the ingest time when nothing was known (then time_source = "ingest_default").
  // event_time_end is the span end for a chunk covering several timed parts;
  // unset for a single instant.
  google.protobuf.Timestamp event_time = 4;
  google.protobuf.Timestamp event_time_end = 5;
  string time_source = 6;
  string time_precision = 7;
}

// LTM semantic query response
message MemoryResponse {
  repeated MemoryResult results = 1;
  // policy_note explains a result set that was emptied or narrowed BECAUSE of
  // access policy, rather than because the corpus had nothing to say (ADR-0085
  // INV-3). Empty when policy played no part.
  //
  // This exists so an agent can answer "I am not permitted to see that" instead of
  // "I found nothing" — two very different statements that a fail-closed model
  // otherwise renders identical. Additive and optional: a client that ignores it
  // behaves exactly as before.
  string policy_note = 2;
}

// GenerateStreamRequest carries the agent's LLM call parameters for
// the Substrate's GenerateViaModelStream streaming proxy (ADR-0018).
//
// ADR-0139 C1 (wave 1c): the request is the structured C1 GenerateRequest —
// `system` blocks, a `messages` conversation, a `response_schema`, `options` with
// field presence and a `cache_ttl`. Every field is additive; an older SDK that sends
// only `prompt` is served exactly as before.
message GenerateStreamRequest {
  // DEPRECATED: use lease_id. See ExecuteToolRequest.session_token_id.
  string session_token_id = 1 [deprecated = true];
  // DEPRECATED (ADR-0139 C1): one string cannot carry a system prompt, a cache
  // breakpoint or a prior turn. Use `system` + `messages`. Ignored when `messages`
  // is non-empty; otherwise wrapped as a lone user turn, so an older SDK still works.
  string prompt = 2 [deprecated = true];
  GenerateOptions options = 3;
  // lease_id is the opaque per-step BudgetLease (ADR-0018).
  string lease_id = 4;
  // The system prompt, stable tier first (ADR-0139 D2). Carried here and never as a
  // "system" role message: a message with role "system" is refused (InvalidArgument).
  repeated SystemBlock system = 5;
  // The conversation ("user" | "assistant" | "tool" turns). Takes precedence over
  // `prompt`.
  repeated ModelMessageProto messages = 6;
  // Ask for a JSON reply conforming to a JSON Schema. A streamed request with a
  // schema is validated (and repaired once) before any text is sent, so it arrives
  // as one text chunk plus the final chunk.
  ResponseSchema response_schema = 7;
  // Lifetime of the cache breakpoints in `system` (only meaningful with a block
  // whose `cache` is true).
  CacheTTL cache_ttl = 8;
}

// GenerateOptions are the generation options of a managed LLM call
// (domain.RequestOptions). Fields 1-3 predate field presence; 1 and 2 are now
// `optional`, which is wire-compatible: an older client that sets them is read the
// same, and an unset value now means "the generator's default" instead of 0.
message GenerateOptions {
  // Output-token cap. Unset (or 0) = the generator's configured default.
  optional int32 max_tokens = 1;
  // Sampling temperature. Unset = the provider's default; 0 is a real temperature.
  optional float temperature = 2;
  repeated string stop_sequences = 3;
  // strict turns an option the generator cannot honour (max_tokens, temperature,
  // stop) into an InvalidArgument error instead of an entry in `ignored`.
  bool strict = 4;
}

// SystemBlock is one block of the system prompt (ADR-0139 C1). `cache` marks the
// END of a stable prefix the provider may cache (an Anthropic cache_control
// breakpoint). Stable text first; volatile text belongs in `messages`.
message SystemBlock {
  string text = 1;
  bool cache = 2;
}

// ResponseSchema asks for a JSON reply conforming to `schema_json` (a JSON Schema
// object, as a string). `strict` requires constrained decoding: a generator that
// can only best-effort it answers InvalidArgument instead of a validated-and-
// repaired reply. A reply that still fails after the one repair is Aborted, never a
// fallback to another provider. (FailedPrecondition stays reserved for "no native
// tool-calling" on GenerateWithTools, the text-protocol fallback signal.)
message ResponseSchema {
  string name = 1;
  string schema_json = 2;
  bool strict = 3;
}

// CacheTTL is the requested lifetime of cache breakpoints, chosen by caller pacing
// (ADR-0139 D1): long for human-paced sessions, short for daemons and subagents.
enum CacheTTL {
  CACHE_TTL_UNSPECIFIED = 0; // the provider's default (Anthropic: 5 minutes)
  CACHE_TTL_SHORT = 1;       // 5 minutes
  CACHE_TTL_LONG = 2;        // 1 hour
}

// GenerateUsage is the usage the provider reported for one call (ADR-0139 C1,
// ADR-0131 D2). input_tokens counts EVERY input token, cached or not; the cache
// fields are breakdowns of it, never additions.
message GenerateUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_read_tokens = 3;
  int32 cache_write_tokens = 4;
  // false when the provider does not report cache writes (OpenAI-compatible
  // endpoints): cache_write_tokens = 0 then means "unknown", not "none".
  bool cache_write_known = 5;
  // true when the numbers are the kernel's len/4 estimate, not a provider report.
  bool estimated = 6;
}

// ToolDefinitionProto is one tool offered to the model (ADR-0097).
message ToolDefinitionProto {
  string name = 1;
  string description = 2;
  // JSON Schema object describing the arguments. Carried as a string because it is
  // authored elsewhere (agent manifests, the kernel tool registry) and this plane
  // only forwards it.
  string parameters_json = 3;
}

// ModelToolCallProto is one tool invocation the MODEL asked for. Distinct from the
// kernel EXECUTING a call (ExecuteTool): the model requests, the kernel authorizes
// and runs. Keeping the two apart keeps an authorization boundary legible.
message ModelToolCallProto {
  // Provider-assigned call id. MUST be echoed back on the corresponding result —
  // providers correlate on it and reject a synthesized one. Never generate locally.
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

// ModelMessageProto is one turn of the provider conversation (ADR-0097 D8).
//
// Native tool-calling is a CONVERSATIONAL protocol, not a request shape: the model
// replies with an assistant turn carrying tool_calls, and the caller must send that
// turn back verbatim alongside one tool-role message per call, correlated by
// tool_call_id. Without those the model cannot see that its own call happened, or
// what it returned.
message ModelMessageProto {
  // "user" | "assistant" | "tool"
  string role = 1;
  string content = 2;
  // Set on an ASSISTANT turn being echoed back — the calls the model asked for.
  repeated ModelToolCallProto tool_calls = 3;
  // Set on a TOOL turn — which call this result answers. Must be the provider's own
  // id from the assistant turn; a synthesized one is rejected.
  string tool_call_id = 4;
}

message GenerateWithToolsRequest {
  string lease_id = 1;
  // DEPRECATED (ADR-0097 D8): a single prompt string cannot express an assistant turn
  // or a tool result, which made every round a fresh conversation in which the model
  // had never called anything. Use `messages`. Ignored when `messages` is non-empty;
  // when `messages` is empty it is wrapped as a lone user turn so an un-upgraded
  // client still works.
  string prompt = 2 [deprecated = true];
  GenerateOptions options = 3;
  repeated ToolDefinitionProto tools = 4;
  repeated ModelMessageProto messages = 5;
  // ADR-0139 C1, as on GenerateStreamRequest: the system prompt (never a "system"
  // role message), a response schema, and the cache-breakpoint lifetime.
  repeated SystemBlock system = 6;
  ResponseSchema response_schema = 7;
  CacheTTL cache_ttl = 8;
}

message GenerateWithToolsResponse {
  string text = 1;
  repeated ModelToolCallProto tool_calls = 2;
  // Normalized stop reason: "tool_use" | "end_turn" | "max_tokens" |
  // "stop_sequence" | "refusal" | "unknown". Mapped at the kernel's adapter so no
  // client learns a provider's vocabulary.
  //
  // Only "end_turn" means finished. Anything else — INCLUDING "unknown" — means the
  // response is incomplete and the loop must continue. A client must also continue
  // whenever tool_calls is non-empty, regardless of this field: some providers
  // report "stop" while returning calls.
  string stop_reason = 3;
  int32 usage_tokens = 4;
  // Request fields the generator did NOT honour ("system", "response_schema",
  // "max_tokens", "temperature", "stop", "cache_breakpoints", "cache_ttl",
  // "tool_choice", "parallel_tool_calls"): a degraded call is visible, never silent.
  repeated string ignored = 5;
  GenerateUsage usage = 6;
  // The model id the provider says served the call.
  string model = 7;
}

// GenerateChunk carries one token group streamed from the Substrate to
// the agent. is_final=true on the last chunk; token_count is the Substrate's
// real-time per-chunk estimate (Pass 1 of dual-pass accounting, ADR-0018).
message GenerateChunk {
  string text = 1;
  int32 token_count = 2;
  bool is_final = 3;
  int32 usage_tokens = 4; // populated only on final chunk when provider supplies usage
  // ADR-0139 C1: set on the FINAL chunk only (is_final=true), and only when the
  // call completed normally (not on a budget cut or a stream error).
  repeated string ignored = 5;      // see GenerateWithToolsResponse.ignored
  GenerateUsage usage = 6;
  string stop_reason = 7;           // see GenerateWithToolsResponse.stop_reason
  string model = 8;
}

// ══ ADR-0139 D12: in-agent subagents (C7) ════════════════════════════════════

// SubagentMode is how the child's context starts (ADR-0139 D12).
enum SubagentMode {
  // Read as ISOLATED: the cheaper default, and the one that leaks nothing.
  SUBAGENT_MODE_UNSPECIFIED = 0;
  // A fresh context: the objective (and output schema) only.
  SUBAGENT_MODE_ISOLATED = 1;
  // Inherits the parent's COMPACTED context, carried in context_summary and
  // context_refs. The kernel does not hold the parent's context (the SDK's D3
  // ContextEngine does), so the parent supplies it.
  SUBAGENT_MODE_FORK = 2;
}

// SubagentStatus is the coarse outcome, so a parent can tell "done" from
// "stopped" without decoding exit_reason (ADR-0139 D12).
enum SubagentStatus {
  SUBAGENT_STATUS_UNSPECIFIED = 0;
  // exit_reason COMPLETED, and the output validated against output_schema when
  // one was given.
  SUBAGENT_STATUS_DONE = 1;
  // The child ran but was stopped before completing (BUDGET, TIMEOUT). text or
  // structured_json may hold a partial result; truncated says so.
  SUBAGENT_STATUS_STOPPED = 2;
  // The child produced no usable result (DEPTH, DENIED, ERROR).
  SUBAGENT_STATUS_FAILED = 3;
}

// SubagentExitReason is why the child ended (ADR-0139 D12; C6 event vocabulary).
enum SubagentExitReason {
  SUBAGENT_EXIT_REASON_UNSPECIFIED = 0;
  SUBAGENT_EXIT_REASON_COMPLETED = 1;
  // The root lease, token_budget, max_tool_rounds or the tree-wide iteration cap
  // ran out.
  SUBAGENT_EXIT_REASON_BUDGET = 2;
  // The spawn would exceed the configured depth (default 1). The child never ran.
  SUBAGENT_EXIT_REASON_DEPTH = 3;
  // Policy refused it: a toolset entry outside the parent's tools, a target the
  // principal may not dispatch to, or a ToolExecutor deny that ended the child.
  SUBAGENT_EXIT_REASON_DENIED = 4;
  // timeout_ms (or the parent's own deadline) elapsed, including while the spawn
  // waited for a concurrency slot (concurrency is config, default 4).
  SUBAGENT_EXIT_REASON_TIMEOUT = 5;
  SUBAGENT_EXIT_REASON_ERROR = 6;
}

message SpawnSubagentRequest {
  // The PARENT's per-step BudgetLease (ADR-0018), a credential, as on
  // ExecuteToolRequest. The kernel resolves it to the parent run and the ROOT
  // lease; the child gets its own lease, bound to the child dispatch and rolling
  // up to that root. Depth is derived from the lease chain server-side, never
  // from the request.
  string lease_id = 1;
  SubagentMode mode = 2;
  // The child's task. Required (empty is INVALID_ARGUMENT).
  string objective = 3;
  // Optional JSON Schema for the child's final answer (same shape and strict
  // semantics as GenerateStreamRequest.response_schema). When set,
  // structured_json is validated against it; a reply that still fails after the
  // one repair ends the child with exit_reason ERROR.
  ResponseSchema output_schema = 4;
  // Tool names or globs ("web_*", "*") for the child. MUST be a subset of the
  // tools the PARENT may call. Enforced server-side against the parent's grants,
  // never trusted from the model: an entry that matches anything outside the
  // parent's set ends the spawn with DENIED (refused, not silently narrowed).
  // Empty = no tools beyond final_answer. "*" = the parent's tools MINUS the
  // classes D12 withholds by default (clarify, memory write, messaging), which a
  // child gets only when they are named explicitly.
  repeated string toolset = 5;
  // Optional target. Both empty = the parent's own profile. Both set is
  // INVALID_ARGUMENT. A target the principal may not dispatch to is DENIED.
  string target_agent_id = 6;
  string target_capability = 7;
  // FORK only: the parent's compacted context (the D3 phase-2 summary shape).
  // Set on an ISOLATED spawn it is INVALID_ARGUMENT.
  string context_summary = 8;
  // FORK only: content refs the child may resolve (resolve_cid), read-scoped to
  // the principal exactly as for the parent.
  repeated ContextRef context_refs = 9;
  // Tool-round cap for the child. 0 = the configured default. The kernel clamps
  // it to what remains of the tree-wide iteration cap; it can never raise it.
  int32 max_tool_rounds = 10;
  // Wall-clock limit for the child in milliseconds. 0 = the configured default.
  // Clamped to the parent call's own deadline.
  int64 timeout_ms = 11;
  // Optional NARROW-ONLY token cap for this child. 0 = none beyond the root
  // lease. It never creates budget: the child also stops when the root lease is
  // spent (D1: no per-child budget escapes the root).
  int64 token_budget = 12;
  // Optional idempotency key (AGENTS.md 2.6). A repeat with the same key under
  // the same root run returns the first child's result instead of spawning again.
  string client_spawn_id = 13;
}

message SpawnSubagentResponse {
  SubagentStatus status = 1;
  SubagentExitReason exit_reason = 2;
  // The child's final text answer (possibly partial when status is STOPPED).
  string text = 3;
  // The final answer as JSON, set when output_schema was given and the reply
  // validated.
  string structured_json = 4;
  // true when text / structured_json is incomplete (cut by budget, timeout or a
  // size cap). A parent MUST NOT treat a truncated result as complete.
  bool truncated = 5;
  // Content ids (ContentStore CIDs / artifact hashes) the child produced,
  // readable by the parent under the same scope.
  repeated string artifacts = 6;
  // The child's model usage summed over its calls. Already counted against the
  // root lease: reported, never billed again.
  GenerateUsage usage = 7;
  // The child dispatch's run id, for the C6 event log and traces.
  string child_run_id = 8;
  // Human-readable detail for any exit_reason other than COMPLETED (which
  // toolset entry was denied, which limit was hit). Never parsed.
  string detail = 9;
  // Tool rounds the child used.
  int32 tool_rounds = 10;
}

// ══ ADR-0139 D14: principal memory notes ═════════════════════════════════════

// MemoryNotesScope is whose notes a document is.
enum MemoryNotesScope {
  MEMORY_NOTES_SCOPE_UNSPECIFIED = 0;
  // The run principal's own notes: the "sub" of the run, not the agent.
  MEMORY_NOTES_SCOPE_PERSONAL = 1;
  // The principal's org scope (D9 org profile). Absent in a personal profile.
  MEMORY_NOTES_SCOPE_ORG = 2;
}

message GetMemoryNotesRequest {
  // The run's BudgetLease. The kernel resolves the run and its principal from
  // it; there is no principal field.
  string lease_id = 1;
}

// MemoryNotesDocument is one scope's notes (an AGENTS.md / MEMORY.md analogue):
// markdown whose "## " headings are the SECTIONS ProposeMemoryNote addresses.
message MemoryNotesDocument {
  MemoryNotesScope scope = 1;
  // The principal id (PERSONAL) or org id (ORG) the document belongs to.
  string owner_id = 2;
  string content = 3;
  // Sizes count Unicode code points of the stored content, so a budget means the
  // same for every model and language.
  int32 size_chars = 4;
  int32 budget_chars = 5;
  // Opaque version of this document; pass it as if_match to write against it.
  string etag = 6;
  // true when content was cut to budget_chars because the budget was lowered
  // below the stored size. Never silent: the snapshot says so.
  bool truncated = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetMemoryNotesResponse {
  // One document per scope the principal may READ (C8 authz), PERSONAL first.
  // A scope with no notes is omitted.
  repeated MemoryNotesDocument documents = 1;
  // Opaque version of the whole snapshot. Constant for the run.
  string version = 2;
  // When the snapshot was frozen (the run start).
  google.protobuf.Timestamp snapshot_at = 3;
}

enum MemoryNoteOp {
  MEMORY_NOTE_OP_UNSPECIFIED = 0; // INVALID_ARGUMENT
  // Append `content` under `section` (created at the end when absent), or at the
  // end of the document when section is empty.
  MEMORY_NOTE_OP_APPEND = 1;
  // Replace the body of `section` with `content`. section is required.
  MEMORY_NOTE_OP_REPLACE_SECTION = 2;
  // Remove `section`, heading and body. section is required; content is ignored.
  MEMORY_NOTE_OP_REMOVE_SECTION = 3;
}

enum MemoryNoteRejection {
  MEMORY_NOTE_REJECTION_UNSPECIFIED = 0; // accepted
  // The write would take the document over budget_chars. Nothing is evicted.
  MEMORY_NOTE_REJECTION_OVER_BUDGET = 1;
  // The injection scan flagged the content; the write is not stored.
  MEMORY_NOTE_REJECTION_INJECTION_FLAGGED = 2;
  // The principal, this agent or this subagent may not write that scope. D12:
  // children have no memory write unless it is granted.
  MEMORY_NOTE_REJECTION_SCOPE_DENIED = 3;
  // if_match did not match the current etag.
  MEMORY_NOTE_REJECTION_CONFLICT = 4;
  // REPLACE_SECTION / REMOVE_SECTION named a section that does not exist.
  MEMORY_NOTE_REJECTION_SECTION_NOT_FOUND = 5;
}

message ProposeMemoryNoteRequest {
  string lease_id = 1;
  // UNSPECIFIED is read as PERSONAL.
  MemoryNotesScope scope = 2;
  MemoryNoteOp op = 3;
  // The section heading text without the leading "## ". Matched exactly.
  string section = 4;
  string content = 5;
  // Optional optimistic-concurrency guard: the etag the agent wrote against.
  string if_match = 6;
  // Why the agent is writing this; recorded with the write (audit trail).
  string reason = 7;
}

message ProposeMemoryNoteResponse {
  // true = stored durably now; it appears in the snapshot from the NEXT run.
  bool accepted = 1;
  MemoryNoteRejection rejection = 2;
  string detail = 3;
  // The document's state after the call (unchanged when rejected).
  string etag = 4;
  int32 size_chars = 5;
  int32 budget_chars = 6;
}

// ══ ADR-0139 D13: agent-proposed skills ══════════════════════════════════════

enum SkillProposalRejection {
  SKILL_PROPOSAL_REJECTION_UNSPECIFIED = 0; // accepted (queued)
  // skill_md is not a valid C3 SKILL.md (frontmatter, name mismatch, size cap).
  SKILL_PROPOSAL_REJECTION_INVALID_FORMAT = 1;
  // A skill with this name exists and base_version is empty or not current.
  SKILL_PROPOSAL_REJECTION_NAME_TAKEN = 2;
  // The target skill is locked against agent edits.
  SKILL_PROPOSAL_REJECTION_LOCKED = 3;
  // The deterministic scan returned "dangerous". Cannot be overridden.
  SKILL_PROPOSAL_REJECTION_SCAN_DANGEROUS = 4;
  // The pending-queue quota for this agent or principal is full.
  SKILL_PROPOSAL_REJECTION_QUOTA = 5;
  // The agent may not propose skills (or not in this scope).
  SKILL_PROPOSAL_REJECTION_DENIED = 6;
}

message ProposeSkillRequest {
  // The proposing run's BudgetLease. The SOURCE RUN of the proposal is the
  // lease's run, derived server-side; an agent cannot name another run.
  string lease_id = 1;
  // The skill name; must equal the frontmatter `name` in skill_md.
  string name = 2;
  // The full C3 SKILL.md (frontmatter and markdown body). The kernel stamps trust
  // "agent-proposed" whatever the frontmatter claims.
  string skill_md = 3;
  // Why this routine is worth keeping (shown to the approving operator).
  string rationale = 4;
  // Optional content ids backing the proposal (artifacts, tool results).
  repeated string evidence_cids = 5;
  // When editing an existing skill: the version proposed against. Empty = a new
  // skill.
  string base_version = 6;
}

message ProposeSkillResponse {
  // true = queued as PENDING. Not active until an operator approves it.
  bool accepted = 1;
  // The proposal id. Deterministic over (name, base_version, content hash): an
  // identical re-proposal returns the existing id with accepted=true.
  string proposal_id = 2;
  SkillProposalRejection rejection = 3;
  string detail = 4;
}
